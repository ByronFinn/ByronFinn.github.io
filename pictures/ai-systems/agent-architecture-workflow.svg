<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" text-anchor="middle">Agent Architecture Patterns</text>
  
  <!-- Central Orchestrator -->
  <rect x="320" y="80" width="160" height="50" rx="8" fill="#3b82f6"/>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">Orchestrator</text>
  
  <!-- Arrows from orchestrator to agents -->
  <path d="M400 130 L400 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320 155 L200 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M480 155 L600 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320 155 L200 320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M480 155 L600 320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Agent 1: Task Decomposition -->
  <rect x="180" y="200" width="120" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="240" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">Task</text>
  <text x="240" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Decomposition</text>
  
  <!-- Agent 2: Tool Selection -->
  <rect x="500" y="200" width="120" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="560" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">Tool</text>
  <text x="560" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Selection</text>
  
  <!-- Agent 3: Memory Management -->
  <rect x="200" y="370" width="120" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="260" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">Memory</text>
  <text x="260" y="422" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Management</text>
  
  <!-- Agent 4: Execution -->
  <rect x="520" y="370" width="120" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="580" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">Execution</text>
  <text x="580" y="422" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Monitoring</text>
  
  <!-- Feedback loops -->
  <path d="M240 250 L240 280" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M560 250 L560 280" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Each agent handles a distinct concern; feedback loops enable self-correction</text>
</svg>