<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#334155" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="420" cy="60" r="2"/>
    <circle cx="540" cy="60" r="2"/><circle cx="660" cy="60" r="2"/><circle cx="780" cy="60" r="2"/><circle cx="900" cy="60" r="2"/>
    <circle cx="1020" cy="60" r="2"/><circle cx="1140" cy="60" r="2"/><circle cx="1220" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="1220" cy="180" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="1220" cy="300" r="2"/>
    <circle cx="60" cy="420" r="2"/><circle cx="1220" cy="420" r="2"/>
    <circle cx="60" cy="540" r="2"/><circle cx="1220" cy="540" r="2"/>
    <circle cx="60" cy="660" r="2"/><circle cx="1220" cy="660" r="2"/>
  </g>

  <!-- top pill -->
  <g>
    <rect x="466" y="52" width="348" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <rect x="486" y="62" width="16" height="24" rx="8" fill="url(#amber)"/>
    <text x="514" y="81" fill="#e2e8f0" font-size="22" font-weight="600">分类器 × 可靠性评估</text>
  </g>

  <!-- title -->
  <text x="640" y="158" text-anchor="middle" fill="#f8fafc" font-size="52" font-weight="700" filter="url(#glow)">分类器，又成了救世主</text>
  <text x="640" y="208" text-anchor="middle" fill="#94a3b8" font-size="22">评估的重心，回到确定性——而不是让 LLM 临场发挥</text>

  <!-- left card: LLM-as-a-Judge -->
  <g>
    <rect x="150" y="260" width="430" height="280" rx="24" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <rect x="150" y="260" width="430" height="64" rx="24" fill="url(#rose)" opacity="0.9"/>
    <rect x="150" y="296" width="430" height="28" fill="url(#rose)" opacity="0.9"/>
    <text x="365" y="300" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">LLM-as-a-Judge 大模型当法官</text>
    <circle cx="210" cy="348" r="22" fill="none" stroke="url(#rose)" stroke-width="3"/>
    <text x="210" y="356" text-anchor="middle" fill="#fda4af" font-size="22" font-weight="700">×</text>
    <text x="268" y="356" fill="#e2e8f0" font-size="20">800 字小作文 + 模糊打分</text>
    <circle cx="210" cy="414" r="22" fill="none" stroke="url(#rose)" stroke-width="3"/>
    <text x="210" y="421" text-anchor="middle" fill="#fda4af" font-size="17" font-weight="700">$</text>
    <text x="268" y="421" fill="#e2e8f0" font-size="20">单次 ≈ $0.056，慢且贵</text>
    <circle cx="210" cy="472" r="22" fill="none" stroke="url(#rose)" stroke-width="3"/>
    <text x="210" y="479" text-anchor="middle" fill="#fda4af" font-size="17" font-weight="700">%</text>
    <text x="268" y="479" fill="#e2e8f0" font-size="20">二元判定准确率 80.0%</text>
  </g>

  <!-- VS badge -->
  <g>
    <circle cx="640" cy="400" r="40" fill="#0b1322" stroke="url(#blue)" stroke-width="3"/>
    <text x="640" y="410" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="800">VS</text>
  </g>

  <!-- right card: Jev 分类器 -->
  <g>
    <rect x="700" y="260" width="430" height="280" rx="24" fill="#111a" stroke="#334155" stroke-width="2"/>
    <rect x="700" y="260" width="430" height="64" rx="24" fill="url(#green)" opacity="0.9"/>
    <rect x="700" y="296" width="430" height="28" fill="url(#green)" opacity="0.9"/>
    <text x="915" y="300" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Jev 分类器 · 确定性</text>
    <circle cx="760" cy="356" r="34" fill="none" stroke="url(#green)" stroke-width="3"/>
    <text x="760" y="364" text-anchor="middle" fill="#6ee7b7" font-size="22" font-weight="700">✓</text>
    <text x="838" y="356" fill="#e2e8f0" font-size="20">bool / score / Noul 类型安全</text>
    <circle cx="760" cy="414" r="22" fill="none" stroke="url(#green)" stroke-width="3"/>
    <text x="760" y="421" text-anchor="middle" fill="#6ee7b7" font-size="17" font-weight="700">$</text>
    <text x="838" y="421" fill="#e2e8f0" font-size="20">单次 $0.00035（0.44s）</text>
    <circle cx="760" cy="472" r="22" fill="none" stroke="url(#green)" stroke-width="3"/>
    <text x="760" y="479" text-anchor="middle" fill="#6ee7b7" font-size="17" font-weight="700">%</text>
    <text x="838" y="479" fill="#e2e8f0" font-size="20">二元判定准确率 100.0%</text>
  </g>

  <!-- bottom band -->
  <g>
    <rect x="150" y="570" width="980" height="86" rx="20" fill="#0b1222" stroke="#334155"/>
    <text x="310" y="612" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="800">全量评测实测</text>
    <text x="660" y="612" text-anchor="middle" fill="#e2e8f0" font-size="19">Claude 500 次 ≈ $28.17</text>
    <text x="1010" y="612" text-anchor="middle" fill="#6ee7b7" font-size="19" font-weight="700">Jev 500 次 ≈ $0.34</text>
    <line x1="460" y1="596" x2="460" y2="640" stroke="#334155" stroke-width="2"/>
    <line x1="840" y1="596" x2="840" y2="640" stroke="#334155" stroke-width="2"/>
  </g>
</svg>