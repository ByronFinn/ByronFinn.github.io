<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold" font-family="system-ui, sans-serif">WebSocket vs HTTP 流式：連接差異</text>

  <!-- WebSocket side -->
  <text x="200" y="70" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">WebSocket（默認）</text>

  <!-- Client -->
  <rect x="60" y="90" width="100" height="36" rx="6" fill="#1e40af" opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="113" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif">Codex Client</text>

  <!-- Server -->
  <rect x="240" y="90" width="100" height="36" rx="6" fill="#1e40af" opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
  <text x="290" y="113" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif">ChatGPT API</text>

  <!-- WS bidirectional arrows -->
  <line x1="160" y1="105" x2="240" y2="105" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="235,100 245,105 235,110" fill="#3b82f6"/>
  <line x1="240" y1="112" x2="160" y2="112" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="165,107 155,112 165,117" fill="#3b82f6"/>
  <text x="200" y="100" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="monospace">upgrade</text>

  <!-- Bidirectional streaming -->
  <line x1="160" y1="145" x2="240" y2="145" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="155" x2="160" y2="155" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="140" text-anchor="middle" fill="#86efac" font-size="9" font-family="monospace">雙向持續連接</text>

  <!-- Interruption -->
  <line x1="200" y1="170" x2="200" y2="195" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="200" y="210" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="system-ui, sans-serif">代理/challenge 打斷</text>
  <text x="200" y="225" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="system-ui, sans-serif">→ Reconnecting... 1/5</text>

  <!-- Pros -->
  <text x="200" y="252" text-anchor="middle" fill="#86efac" font-size="11" font-family="system-ui, sans-serif">✓ 實時雙向通信</text>
  <text x="200" y="268" text-anchor="middle" fill="#86efac" font-size="11" font-family="system-ui, sans-serif">✓ 可中途 interrupt/steer</text>
  <text x="200" y="284" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif">✗ 長連接容易斷</text>
  <text x="200" y="300" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif">✗ 代理環境不友好</text>

  <!-- Divider -->
  <line x1="400" y1="60" x2="400" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- HTTP side -->
  <text x="600" y="70" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">HTTP 流式（關掉 WS）</text>

  <!-- Client -->
  <rect x="460" y="90" width="100" height="36" rx="6" fill="#78350f" opacity="0.5" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="113" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="system-ui, sans-serif">Codex Client</text>

  <!-- Server -->
  <rect x="640" y="90" width="100" height="36" rx="6" fill="#78350f" opacity="0.5" stroke="#f59e0b" stroke-width="1"/>
  <text x="690" y="113" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="system-ui, sans-serif">ChatGPT API</text>

  <!-- HTTP request -->
  <line x1="560" y1="103" x2="640" y2="103" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="635,98 645,103 635,108" fill="#f59e0b"/>
  <text x="600" y="98" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace">POST</text>

  <!-- HTTP response streaming -->
  <line x1="640" y1="115" x2="560" y2="115" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="600" y="130" text-anchor="middle" fill="#86efac" font-size="9" font-family="monospace">SSE / chunked response</text>

  <!-- No persistent connection -->
  <text x="600" y="170" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">每次請求獨立</text>
  <text x="600" y="185" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">不存在「斷連重連」</text>
  <text x="600" y="210" text-anchor="middle" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">→ 穩定，不走 WS 協議</text>

  <!-- Pros -->
  <text x="600" y="252" text-anchor="middle" fill="#86efac" font-size="11" font-family="system-ui, sans-serif">✓ 代理環境穩定</text>
  <text x="600" y="268" text-anchor="middle" fill="#86efac" font-size="11" font-family="system-ui, sans-serif">✓ 不存在重連問題</text>
  <text x="600" y="284" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif">✗ 首token可能略慢</text>
  <text x="600" y="300" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif">✗ 中途 steering 體驗差</text>
</svg>
