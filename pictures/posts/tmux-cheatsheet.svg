<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#22c55e"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3b82f6"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker>
  </defs>
  <rect width="820" height="360" fill="url(#bg)" rx="12"/>

  <text x="410" y="38" fill="#f1f5f9" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Tmux 常用操作速查</text>

  <!-- Session management -->
  <text x="60" y="75" fill="#3b82f6" font-size="13" font-weight="bold" font-family="sans-serif">会话管理</text>
  <rect x="50" y="85" width="350" height="120" rx="6" fill="#1e293b"/>
  <text x="65" y="108" fill="#e2e8f0" font-size="11" font-family="monospace">tmux new -s dev</text>
  <text x="260" y="108" fill="#64748b" font-size="10" font-family="sans-serif">新建命名会话</text>
  <text x="65" y="130" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b d</text>
  <text x="260" y="130" fill="#64748b" font-size="10" font-family="sans-serif">分离会话（后台运行）</text>
  <text x="65" y="152" fill="#e2e8f0" font-size="11" font-family="monospace">tmux ls</text>
  <text x="260" y="152" fill="#64748b" font-size="10" font-family="sans-serif">列出所有会话</text>
  <text x="65" y="174" fill="#e2e8f0" font-size="11" font-family="monospace">tmux attach -t dev</text>
  <text x="260" y="174" fill="#64748b" font-size="10" font-family="sans-serif">重新接入会话</text>
  <text x="65" y="196" fill="#e2e8f0" font-size="11" font-family="monospace">tmux kill-session -t dev</text>
  <text x="260" y="196" fill="#64748b" font-size="10" font-family="sans-serif">杀死会话</text>

  <!-- Pane operations -->
  <text x="450" y="75" fill="#22c55e" font-size="13" font-weight="bold" font-family="sans-serif">窗格操作</text>
  <rect x="440" y="85" width="350" height="120" rx="6" fill="#1e293b"/>
  <text x="455" y="108" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b %</text>
  <text x="630" y="108" fill="#64748b" font-size="10" font-family="sans-serif">左右分屏</text>
  <text x="455" y="130" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b "</text>
  <text x="630" y="130" fill="#64748b" font-size="10" font-family="sans-serif">上下分屏</text>
  <text x="455" y="152" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b &lt;方向键&gt;</text>
  <text x="630" y="152" fill="#64748b" font-size="10" font-family="sans-serif">切换窗格</text>
  <text x="455" y="174" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b z</text>
  <text x="630" y="174" fill="#64748b" font-size="10" font-family="sans-serif">全屏/还原</text>
  <text x="455" y="196" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b x</text>
  <text x="630" y="196" fill="#64748b" font-size="10" font-family="sans-serif">关闭当前窗格</text>

  <!-- Window operations -->
  <text x="60" y="240" fill="#8b5cf6" font-size="13" font-weight="bold" font-family="sans-serif">窗口管理</text>
  <rect x="50" y="250" width="350" height="95" rx="6" fill="#1e293b"/>
  <text x="65" y="273" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b c</text>
  <text x="260" y="273" fill="#64748b" font-size="10" font-family="sans-serif">新建窗口</text>
  <text x="65" y="295" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b n / p</text>
  <text x="260" y="295" fill="#64748b" font-size="10" font-family="sans-serif">下一个/上一个窗口</text>
  <text x="65" y="317" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b 0-9</text>
  <text x="260" y="317" fill="#64748b" font-size="10" font-family="sans-serif">跳转到指定窗口</text>
  <text x="65" y="339" fill="#e2e8f0" font-size="11" font-family="monospace">Ctrl+b ,</text>
  <text x="260" y="339" fill="#64748b" font-size="10" font-family="sans-serif">重命名窗口</text>

  <!-- Typical workflow -->
  <text x="450" y="240" fill="#f59e0b" font-size="13" font-weight="bold" font-family="sans-serif">最简工作流</text>
  <rect x="440" y="250" width="350" height="95" rx="6" fill="#1e293b"/>

  <circle cx="465" cy="278" r="12" fill="#3b82f6" opacity="0.8"/>
  <text x="465" y="282" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="485" y="282" fill="#e2e8f0" font-size="11" font-family="sans-serif">tmux new -s work</text>

  <line x1="620" y1="278" x2="640" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <circle cx="660" cy="278" r="12" fill="#22c55e" opacity="0.8"/>
  <text x="660" y="282" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="680" y="282" fill="#e2e8f0" font-size="11" font-family="sans-serif">干活</text>

  <line x1="715" y1="290" x2="715" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <circle cx="510" cy="322" r="12" fill="#f59e0b" opacity="0.8"/>
  <text x="510" y="326" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="530" y="326" fill="#e2e8f0" font-size="11" font-family="sans-serif">Ctrl+b d 分离</text>

  <line x1="625" y1="322" x2="645" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <circle cx="660" cy="322" r="12" fill="#8b5cf6" opacity="0.8"/>
  <text x="660" y="326" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="680" y="326" fill="#e2e8f0" font-size="11" font-family="sans-serif">attach 回来</text>
</svg>