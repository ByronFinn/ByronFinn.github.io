<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#334155" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="1220" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="1220" cy="180" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="1220" cy="300" r="2"/>
    <circle cx="60" cy="420" r="2"/><circle cx="1220" cy="420" r="2"/>
  </g>

  <!-- input node: Context + Answer -->
  <g>
    <rect x="90" y="180" width="210" height="150" rx="18" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <rect x="90" y="180" width="210" height="46" rx="18" fill="url(#blue)" opacity="0.9"/>
    <rect x="90" y="208" width="210" height="18" fill="url(#blue)" opacity="0.9"/>
    <text x="195" y="210" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">输入（结构化）</text>
    <text x="195" y="256" text-anchor="middle" fill="#cbd5e1" font-size="17">Context 检索上下文</text>
    <text x="195" y="292" text-anchor="middle" fill="#cbd5e1" font-size="17">Answer 生成结果</text>
  </g>

  <!-- encoder -->
  <g>
    <rect x="420" y="180" width="210" height="150" rx="18" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <rect x="420" y="180" width="210" height="46" rx="18" fill="url(#amber)" opacity="0.9"/>
    <rect x="420" y="208" width="210" height="18" fill="url(#amber)" opacity="0.9"/>
    <text x="525" y="210" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">编码</text>
    <text x="525" y="260" text-anchor="middle" fill="#cbd5e1" font-size="16">Transformer / cross-encoder</text>
    <text x="525" y="296" text-anchor="middle" fill="#cbd5e1" font-size="16">冻结骨干 + 分类头</text>
    <text x="525" y="310" text-anchor="middle" fill="#64748b" font-size="13">不做自回归生成</text>
  </g>

  <!-- output: bool/score -->
  <g>
    <rect x="770" y="180" width="210" height="150" rx="18" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <rect x="770" y="180" width="210" height="46" rx="18" fill="url(#green)" opacity="0.9"/>
    <rect x="770" y="208" width="210" height="18" fill="url(#green)" opacity="0.9"/>
    <text x="875" y="210" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">输出（确定性）</text>
    <text x="875" y="260" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="700">bool 0 / 1</text>
    <text x="875" y="294" text-anchor="middle" fill="#cbd5e1" font-size="16">score · Noul + 置信度</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="3" fill="none">
    <line x1="300" y1="255" x2="410" y2="255"/>
    <polygon points="405,250 420,255 405,260" fill="#64748b"/>
    <line x1="630" y1="255" x2="760" y2="255"/>
    <polygon points="755,250 770,255 755,260" fill="#64748b"/>
  </g>

  <!-- bottom labels -->
  <text x="640" y="404" text-anchor="middle" fill="#94a3b8" font-size="17">类型化输出可直接接进 CI/CD 门禁，替代“看完给个感觉”</text>
  <text x="640" y="452" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="700">救世主不是新模型，是确定性的回归</text>
</svg>