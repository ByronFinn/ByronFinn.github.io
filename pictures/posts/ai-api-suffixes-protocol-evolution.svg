<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">AI API 协议演进路径</text>

  <!-- Timeline line -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Era 1: /completions -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="75" y="22" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">/v1/completions</text>
    <text x="75" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">2020-2022</text>
    <line x1="15" y1="62" x2="135" y2="62" stroke="#334155" stroke-width="0.5"/>
    <text x="75" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">文本续写</text>
    <text x="75" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10">prompt → 补全</text>
    <text x="75" y="116" text-anchor="middle" fill="#64748b" font-size="9">无结构化消息</text>
    <text x="75" y="130" text-anchor="middle" fill="#64748b" font-size="9">手动拼接对话</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M260 170 L280 170" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Era 2: /chat/completions -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="75" y="22" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">/chat/completions</text>
    <text x="75" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">2023-至今</text>
    <line x1="15" y1="62" x2="135" y2="62" stroke="#334155" stroke-width="0.5"/>
    <text x="75" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">结构化消息</text>
    <text x="75" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10">messages 数组</text>
    <text x="75" y="116" text-anchor="middle" fill="#64748b" font-size="9">行业通用协议</text>
    <text x="75" y="130" text-anchor="middle" fill="#64748b" font-size="9">生态最成熟</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M450 170 L470 170" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Era 3: /messages (Claude) -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#22c55e" fill-opacity="0.15"/>
    <text x="75" y="22" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="600">/v1/messages</text>
    <text x="75" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Anthropic</text>
    <line x1="15" y1="62" x2="135" y2="62" stroke="#334155" stroke-width="0.5"/>
    <text x="75" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">content blocks</text>
    <text x="75" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10">system 顶层参数</text>
    <text x="75" y="116" text-anchor="middle" fill="#64748b" font-size="9">stop_reason</text>
    <text x="75" y="130" text-anchor="middle" fill="#64748b" font-size="9">Claude 原生协议</text>
  </g>

  <!-- Era 4: /responses -->
  <g transform="translate(290, 270)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="75" y="22" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">/v1/responses</text>
    <text x="75" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">OpenAI 新一代</text>
    <line x1="15" y1="62" x2="135" y2="62" stroke="#334155" stroke-width="0.5"/>
    <text x="75" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">统一响应对象</text>
    <text x="75" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10">input/output items</text>
    <text x="75" y="116" text-anchor="middle" fill="#64748b" font-size="9">多工具 + 状态</text>
    <text x="75" y="130" text-anchor="middle" fill="#64748b" font-size="9">Agent 场景优先</text>
  </g>

  <!-- Arrow down from chat/completions to responses -->
  <path d="M365 240 L365 265" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Gemini -->
  <g transform="translate(530, 270)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="90" y="22" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">models/{}:generate</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Google Gemini</text>
    <line x1="15" y1="62" x2="165" y2="62" stroke="#334155" stroke-width="0.5"/>
    <text x="90" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">RESTful 资源风格</text>
    <text x="90" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10">contents + parts</text>
    <text x="90" y="116" text-anchor="middle" fill="#64748b" font-size="9">v1 稳定 / v1beta 预览</text>
    <text x="90" y="130" text-anchor="middle" fill="#64748b" font-size="9">Google API 风格</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 430)">
    <text x="0" y="0" fill="#64748b" font-size="10">协议不兼容 → 需要适配层    |    /v1 = API 版本，不是模型版本</text>
  </g>
</svg>