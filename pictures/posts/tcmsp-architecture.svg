  <text x="145" y="308" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">DynamicAgentExecutor</text>
  <text x="145" y="320" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">GateDecisionHandler</text>

  <text x="310" y="293" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui, sans-serif" font-weight="600">Workflows</text>
  <text x="310" y="308" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">Research Session</text>
  <text x="310" y="320" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">Async Pipeline</text>

  <text x="475" y="293" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui, sans-serif" font-weight="600">Skills &amp; Modules</text>
  <text x="475" y="308" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">模块推荐 / 探索</text>
  <text x="475" y="320" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">技能注册中心</text>

  <text x="640" y="293" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui, sans-serif" font-weight="600">API Endpoints</text>
