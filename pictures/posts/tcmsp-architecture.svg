     ════════════════════════════════════════════════════════════════ -->
  <line x1="410" y1="175" x2="410" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <polygon points="404,205 410,215 416,205" fill="#8b5cf6"/>
  <text x="424" y="198" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif">HTTP API</text>

