     ════════════════════════════════════════════════════════════════ -->
  <line x1="410" y1="345" x2="410" y2="380" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="404,375 410,385 416,375" fill="#f59e0b"/>
  <text x="424" y="368" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif">HTTP API</text>

