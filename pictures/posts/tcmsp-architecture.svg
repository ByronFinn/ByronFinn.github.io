     Layer 3: 核心服务层 (Core Service Layer)
     ════════════════════════════════════════════════════════════════ -->
  <rect x="40" y="385" width="740" height="105" rx="8" fill="url(#layerService)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="40" y="385" width="115" height="26" rx="4" fill="#f59e0b" fill-opacity="0.25"/>
