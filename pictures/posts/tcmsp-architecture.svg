  <polygon points="404,525 410,535 416,525" fill="#22c55e"/>
  <text x="424" y="518" fill="#22c55e" font-size="9" font-family="system-ui, sans-serif">异步任务</text>

  <!-- ════════════════════════════════════════════════════════════════
     Layer 4: 计算执行层 (Compute/Execution Layer)
     ════════════════════════════════════════════════════════════════ -->
  <rect x="40" y="535" width="740" height="85" rx="8" fill="url(#layerCompute)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="40" y="535" width="115" height="26" rx="4" fill="#22c55e" fill-opacity="0.25"/>
  <text x="97" y="552" text-anchor="middle" fill="#86efac" font-size="11" font-family="system-ui, sans-serif" font-weight="600">计算执行层</text>
  <text x="160" y="552" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">异步 / 批处理 / Docker 容器</text>

  <rect x="75" y="570" width="136" height="38" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="143" y="590" text-anchor="middle" fill="#86efac" font-size="9" font-family="system-ui, sans-serif">分子对接</text>
  <text x="143" y="602" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="system-ui, sans-serif">AutoDock Vina</text>

  <rect x="226" y="570" width="136" height="38" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="294" y="590" text-anchor="middle" fill="#86efac" font-size="9" font-family="system-ui, sans-serif">分子动力学</text>
  <text x="294" y="602" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="system-ui, sans-serif">GROMACS</text>

  <rect x="377" y="570" width="136" height="38" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="445" y="590" text-anchor="middle" fill="#86efac" font-size="9" font-family="system-ui, sans-serif">属性 / 毒性预测</text>
  <text x="445" y="602" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="system-ui, sans-serif">ML 模型</text>

  <rect x="528" y="570" width="136" height="38" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="596" y="590" text-anchor="middle" fill="#86efac" font-size="9" font-family="system-ui, sans-serif">虚拟敲除</text>
  <text x="596" y="602" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="system-ui, sans-serif">基因级模拟</text>

  <!-- tcmsp-prds label at bottom right -->
  <rect x="679" y="570" width="86" height="38" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="722" y="590" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">tcmsp-prds</text>
  <text x="722" y="602" text-anchor="middle" fill="#64748b" font-size="7" font-family="system-ui, sans-serif">PRD / 路线图</text>
</svg>
