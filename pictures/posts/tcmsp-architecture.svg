<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Layer background gradients -->
    <linearGradient id="layerAccess" x1="40" y1="70" x2="780" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layerOrch" x1="40" y1="210" x2="780" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layerService" x1="40" y1="380" x2="780" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="layerCompute" x1="40" y1="530" x2="780" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="820" height="640" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="410" y="35" text-anchor="middle" fill="#e2e8f0" font-size="17" font-family="system-ui, sans-serif" font-weight="600">TCMSP 系统容器图（Container Diagram）</text>

  <!-- ════════════════════════════════════════════════════════════════
     Layer 1: 接入层 (Access Layer)
     ════════════════════════════════════════════════════════════════ -->
  <rect x="40" y="70" width="740" height="105" rx="8" fill="url(#layerAccess)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="40" y="70" width="100" height="26" rx="4" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="90" y="87" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">接入层</text>
  <text x="145" y="87" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">用户交互入口</text>

  <!-- tcmsp-desktop -->
  <rect x="75" y="108" width="140" height="52" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="145" y="130" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-desktop</text>
  <text x="145" y="148" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">桌面端 · Tauri + Rust + Vue</text>

  <!-- tcmsp-web -->
  <rect x="245" y="108" width="140" height="52" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="315" y="130" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-web</text>
  <text x="315" y="148" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">公开前端 · Vue 3</text>

  <!-- tcmsp-admin-web -->
  <rect x="415" y="108" width="140" height="52" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="485" y="130" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-admin-web</text>
  <text x="485" y="148" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">管理后台 · Vue 3 + Element+</text>

  <!-- tcmsp-cms-web -->
  <rect x="585" y="108" width="140" height="52" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="655" y="130" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-cms-web</text>
  <text x="655" y="148" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">CMS 前端</text>

  <!-- ════════════════════════════════════════════════════════════════
