  <text x="160" y="402" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">数据 / 认证 / 内容</text>

  <!-- tcmsp -->
  <rect x="75" y="423" width="200" height="52" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
