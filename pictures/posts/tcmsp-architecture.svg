  <text x="175" y="462" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">核心搜索 / 数据 API · FastAPI + PostgreSQL</text>

  <!-- tcmsp-ums -->
  <rect x="310" y="423" width="165" height="52" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="392" y="445" text-anchor="middle" fill="#fcd34d" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-ums</text>
  <text x="392" y="462" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">用户 / 认证 · Casdoor OIDC</text>

  <!-- tcmsp-cms -->
  <rect x="510" y="423" width="165" height="52" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="592" y="445" text-anchor="middle" fill="#fcd34d" font-size="11" font-family="system-ui, sans-serif" font-weight="600">tcmsp-cms</text>
  <text x="592" y="462" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">内容管理 · FastAPI（过渡）</text>

