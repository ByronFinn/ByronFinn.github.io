  <rect x="40" y="215" width="115" height="26" rx="4" fill="#8b5cf6" fill-opacity="0.25"/>
  <text x="97" y="232" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="600">AI 编排层</text>
  <text x="160" y="232" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">智能体调度与工作流编排</text>

