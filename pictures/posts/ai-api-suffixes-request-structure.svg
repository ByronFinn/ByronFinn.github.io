<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">四大协议的请求结构对比</text>

  <!-- Column 1: OpenAI Chat -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="170" height="410" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="85" y="24" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">OpenAI Chat</text>

    <!-- Structure blocks -->
    <rect x="15" y="50" width="140" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="85" y="69" text-anchor="middle" fill="#c4b5fd" font-size="11">model</text>

    <rect x="15" y="88" width="140" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="85" y="107" text-anchor="middle" fill="#c4b5fd" font-size="11">messages[]</text>

    <rect x="30" y="126" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">role: system</text>

    <rect x="30" y="154" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="169" text-anchor="middle" fill="#94a3b8" font-size="9">role: user</text>

    <rect x="30" y="182" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="197" text-anchor="middle" fill="#94a3b8" font-size="9">role: assistant</text>

    <rect x="30" y="210" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="225" text-anchor="middle" fill="#94a3b8" font-size="9">role: tool</text>

    <rect x="15" y="246" width="140" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="85" y="265" text-anchor="middle" fill="#c4b5fd" font-size="11">temperature</text>

    <rect x="15" y="284" width="140" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="85" y="303" text-anchor="middle" fill="#c4b5fd" font-size="11">tools[]</text>

    <rect x="15" y="322" width="140" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="85" y="341" text-anchor="middle" fill="#c4b5fd" font-size="11">stream</text>

    <!-- Response path -->
    <line x1="15" y1="365" x2="155" y2="365" stroke="#334155" stroke-width="0.5"/>
    <text x="85" y="384" text-anchor="middle" fill="#64748b" font-size="9">choices[0]</text>
    <text x="85" y="398" text-anchor="middle" fill="#64748b" font-size="9">.message.content</text>
  </g>

  <!-- Column 2: Anthropic -->
  <g transform="translate(215, 60)">
    <rect x="0" y="0" width="170" height="410" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#22c55e" fill-opacity="0.15"/>
    <text x="85" y="24" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Anthropic Messages</text>

    <rect x="15" y="50" width="140" height="28" rx="4" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="0.5"/>
    <text x="85" y="69" text-anchor="middle" fill="#86efac" font-size="11">model</text>

    <rect x="15" y="88" width="140" height="28" rx="4" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="0.5"/>
    <text x="85" y="107" text-anchor="middle" fill="#86efac" font-size="11">max_tokens</text>

    <rect x="15" y="126" width="140" height="28" rx="4" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="0.8"/>
    <text x="85" y="145" text-anchor="middle" fill="#86efac" font-size="11">system (顶层)</text>

    <rect x="15" y="164" width="140" height="28" rx="4" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="0.5"/>
    <text x="85" y="183" text-anchor="middle" fill="#86efac" font-size="11">messages[]</text>

    <rect x="30" y="202" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="217" text-anchor="middle" fill="#94a3b8" font-size="9">role: user</text>

    <rect x="30" y="230" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="245" text-anchor="middle" fill="#94a3b8" font-size="9">role: assistant</text>

    <rect x="15" y="266" width="140" height="28" rx="4" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="0.5"/>
    <text x="85" y="285" text-anchor="middle" fill="#86efac" font-size="11">content blocks</text>

    <rect x="30" y="304" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="319" text-anchor="middle" fill="#94a3b8" font-size="9">text / image / tool</text>

    <!-- Response path -->
    <line x1="15" y1="340" x2="155" y2="340" stroke="#334155" stroke-width="0.5"/>
    <text x="85" y="360" text-anchor="middle" fill="#64748b" font-size="9">content[0].text</text>
    <text x="85" y="378" text-anchor="middle" fill="#64748b" font-size="9">stop_reason</text>
    <text x="85" y="396" text-anchor="middle" fill="#64748b" font-size="9">usage.input_tokens</text>
    <text x="85" y="410" text-anchor="middle" fill="#64748b" font-size="9">usage.output_tokens</text>
  </g>

  <!-- Column 3: OpenAI Responses -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="170" height="410" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="85" y="24" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">OpenAI Responses</text>

    <rect x="15" y="50" width="140" height="28" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="85" y="69" text-anchor="middle" fill="#fde68a" font-size="11">model</text>

    <rect x="15" y="88" width="140" height="28" rx="4" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="85" y="107" text-anchor="middle" fill="#fde68a" font-size="11">input / items</text>

    <rect x="30" y="126" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">input_text</text>

    <rect x="30" y="154" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="169" text-anchor="middle" fill="#94a3b8" font-size="9">input_image</text>

    <rect x="15" y="190" width="140" height="28" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="85" y="209" text-anchor="middle" fill="#fde68a" font-size="11">tools[]</text>

    <rect x="30" y="228" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="243" text-anchor="middle" fill="#94a3b8" font-size="9">web_search</text>

    <rect x="30" y="256" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="271" text-anchor="middle" fill="#94a3b8" font-size="9">file_search</text>

    <rect x="30" y="284" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="299" text-anchor="middle" fill="#94a3b8" font-size="9">code_interpreter</text>

    <!-- Response path -->
    <line x1="15" y1="320" x2="155" y2="320" stroke="#334155" stroke-width="0.5"/>
    <text x="85" y="340" text-anchor="middle" fill="#64748b" font-size="9">output[]</text>
    <text x="85" y="358" text-anchor="middle" fill="#64748b" font-size="9">output_text</text>
    <text x="85" y="376" text-anchor="middle" fill="#64748b" font-size="9">多个 output items</text>
    <text x="85" y="394" text-anchor="middle" fill="#64748b" font-size="9">支持服务端状态</text>
  </g>

  <!-- Column 4: Gemini -->
  <g transform="translate(585, 60)">
    <rect x="0" y="0" width="170" height="410" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="85" y="24" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Gemini generate</text>

    <rect x="15" y="50" width="140" height="28" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="85" y="69" text-anchor="middle" fill="#93c5fd" font-size="11">model (路径参数)</text>

    <rect x="15" y="88" width="140" height="28" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="85" y="107" text-anchor="middle" fill="#93c5fd" font-size="11">contents[]</text>

    <rect x="30" y="126" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">role: user</text>

    <rect x="30" y="154" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="169" text-anchor="middle" fill="#94a3b8" font-size="9">role: model</text>

    <rect x="15" y="190" width="140" height="28" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="85" y="209" text-anchor="middle" fill="#93c5fd" font-size="11">parts[]</text>

    <rect x="30" y="228" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="243" text-anchor="middle" fill="#94a3b8" font-size="9">text</text>

    <rect x="30" y="256" width="110" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="85" y="271" text-anchor="middle" fill="#94a3b8" font-size="9">inline_data</text>

    <rect x="15" y="292" width="140" height="28" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="85" y="311" text-anchor="middle" fill="#93c5fd" font-size="11">generationConfig</text>

    <!-- Response path -->
    <line x1="15" y1="335" x2="155" y2="335" stroke="#334155" stroke-width="0.5"/>
    <text x="85" y="355" text-anchor="middle" fill="#64748b" font-size="9">candidates[0]</text>
    <text x="85" y="373" text-anchor="middle" fill="#64748b" font-size="9">.content.parts[0]</text>
    <text x="85" y="391" text-anchor="middle" fill="#64748b" font-size="9">.text</text>
  </g>

  <!-- Footer note -->
  <text x="400" y="490" text-anchor="middle" fill="#475569" font-size="10">结构不同 → 解析代码不能混用 → 选错协议会报错或丢数据</text>
</svg>