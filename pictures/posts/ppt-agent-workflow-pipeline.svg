<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="600">PPT Agent 生成流水线</text>

  <!-- Step 1: 需求调研 — Blue -->
  <g transform="translate(60, 80)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
    <circle cx="70" cy="55" r="24" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <!-- Magnifying glass -->
    <circle cx="66" cy="51" r="10" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
    <line x1="73" y1="58" x2="82" y2="67" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">需求调研</text>
    <text x="70" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Research</text>
    <rect x="55" y="145" width="30" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(200, 155)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="40,-5 50,0 40,5" fill="#475569"/>
  </g>

  <!-- Step 2: 大纲策划 — Purple -->
  <g transform="translate(250, 80)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <circle cx="70" cy="55" r="24" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <!-- List icon -->
    <line x1="56" y1="44" x2="84" y2="44" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="52" x2="84" y2="52" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="60" x2="76" y2="60" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="44" r="1.5" fill="#8b5cf6"/>
    <circle cx="52" cy="52" r="1.5" fill="#8b5cf6"/>
    <circle cx="52" cy="60" r="1.5" fill="#8b5cf6"/>
    <text x="70" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">大纲策划</text>
    <text x="70" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Outline</text>
    <rect x="55" y="145" width="30" height="4" rx="2" fill="#8b5cf6" opacity="0.6"/>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(390, 155)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="40,-5 50,0 40,5" fill="#475569"/>
  </g>

  <!-- Step 3: 策划稿 — Green -->
  <g transform="translate(440, 80)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" opacity="0.95"/>
    <circle cx="70" cy="55" r="24" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
    <!-- Layout grid icon -->
    <rect x="55" y="42" width="12" height="12" rx="2" fill="none" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="71" y="42" width="14" height="12" rx="2" fill="none" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="55" y="57" width="30" height="8" rx="2" fill="none" stroke="#22c55e" stroke-width="1.8"/>
    <text x="70" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">策划稿</text>
    <text x="70" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Content Plan</text>
    <rect x="55" y="145" width="30" height="4" rx="2" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(580, 155)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="40,-5 50,0 40,5" fill="#475569"/>
  </g>

  <!-- Step 4: SVG设计 — Amber -->
  <g transform="translate(630, 80)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <circle cx="70" cy="55" r="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <!-- Palette icon -->
    <circle cx="70" cy="52" r="13" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="64" cy="48" r="2.5" fill="#3b82f6"/>
    <circle cx="70" cy="44" r="2.5" fill="#22c55e"/>
    <circle cx="76" cy="48" r="2.5" fill="#8b5cf6"/>
    <circle cx="73" cy="56" r="2.5" fill="#f59e0b"/>
    <text x="70" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">SVG设计</text>
    <text x="70" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Design</text>
    <rect x="55" y="145" width="30" height="4" rx="2" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Bottom subtle line -->
  <line x1="100" y1="270" x2="700" y2="270" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
  <text x="400" y="286" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">AI-Powered Presentation Pipeline</text>
</svg>