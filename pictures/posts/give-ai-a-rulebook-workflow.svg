<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="640" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="700">同一条愿望，两条路径</text>
  <line x1="300" y1="48" x2="620" y2="48" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <text x="460" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">同一个模型，「直接让 AI 写」和「先对齐再动手」，唯一变量是流程</text>

  <!-- ======== 左：许愿路径 ======== -->
  <text x="230" y="105" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="15" font-weight="600">许愿路径 · 一句话丢给 AI</text>

  <g filter="shadow">
    <rect x="60" y="120" width="340" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="148" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="14" font-weight="600">一句话需求</text>
    <text x="230" y="172" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13">「给列表页加个导出按钮」</text>
  </g>
  <line x1="230" y1="190" x2="230" y2="218" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <g filter="shadow">
    <rect x="60" y="222" width="340" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="250" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="14" font-weight="600">AI 补上所有默认答案</text>
    <text x="230" y="274" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13">没人问，它也不问</text>
  </g>
  <line x1="230" y1="292" x2="230" y2="320" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <g filter="shadow">
    <rect x="60" y="324" width="340" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="352" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="14" font-weight="600">代码能跑 · 测试全绿</text>
    <text x="230" y="376" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13">没有任何报错，AI 说完成了</text>
  </g>
  <line x1="230" y1="394" x2="230" y2="422" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <g filter="shadow">
    <rect x="60" y="426" width="340" height="80" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="230" y="456" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">交付失败</text>
    <text x="230" y="480" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="12.5">导出列对不上 · 十万行卡死 · 无权限校验</text>
  </g>

  <!-- ======== 右：规矩路径 ======== -->
  <text x="660" y="105" text-anchor="middle" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="15" font-weight="600">规矩路径 · 六个阶段按顺序走</text>

  <g filter="shadow">
    <rect x="430" y="120" width="430" height="54" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="452" y="145" text-anchor="start" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">① 需求对齐</text>
    <text x="452" y="165" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">导出哪些列 · 数据多大 · 谁有权限</text>
  </g>
  <line x1="645" y1="174" x2="645" y2="198" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <g filter="shadow">
    <rect x="430" y="202" width="430" height="54" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="452" y="227" text-anchor="start" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">② 设计决策</text>
    <text x="452" y="247" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">大数据量异步处理 · 技术选型</text>
  </g>
  <line x1="645" y1="256" x2="645" y2="280" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <g filter="shadow">
    <rect x="430" y="284" width="430" height="54" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="452" y="309" text-anchor="start" fill="#86efac" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">③ 任务拆分</text>
    <text x="452" y="329" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">三个独立可验收的垂直切片</text>
  </g>
  <line x1="645" y1="338" x2="645" y2="362" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g filter="shadow">
    <rect x="430" y="366" width="430" height="54" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="452" y="391" text-anchor="start" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">④ 逐步实现</text>
    <text x="452" y="411" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">小步提交 · 用例先行驱动</text>
  </g>
  <line x1="645" y1="420" x2="645" y2="444" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <g filter="shadow">
    <rect x="430" y="448" width="430" height="54" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="452" y="473" text-anchor="start" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">⑤ 独立评审</text>
    <text x="452" y="493" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">对照原始需求，矛盾交给人裁</text>
  </g>
  <line x1="645" y1="502" x2="645" y2="526" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <g filter="shadow">
    <rect x="430" y="530" width="430" height="54" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="452" y="555" text-anchor="start" fill="#86efac" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">⑥ 知识交接</text>
    <text x="452" y="575" text-anchor="start" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">PRD / ADR / 调研记录落在仓库</text>
  </g>

  <!-- ======== 底部 ======== -->
  <rect x="160" y="600" width="600" height="30" rx="15" fill="#334155" opacity="0.9"/>
  <text x="460" y="620" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600">同一个模型 —— 差距在流程，不在模型</text>
</svg>
