<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold" font-family="system-ui, sans-serif">苹果美区 ID 注册流程</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="200" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">① 创建国区 Apple ID</text>
  <text x="140" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">apple.com 创建账户</text>
  <text x="140" y="136" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">邮箱用 Gmail / Outlook</text>
  <text x="140" y="154" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="system-ui, sans-serif">直接填美国 +86 会被拒</text>

  <!-- Arrow 1→2 -->
  <line x1="240" y1="115" x2="290" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="300" y="70" width="200" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="98" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">② 完成两步验证</text>
  <text x="400" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">邮箱验证码 + 手机验证码</text>
  <text x="400" y="136" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">进入个人账户页面</text>

  <!-- Arrow 2→3 -->
  <line x1="500" y1="115" x2="550" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="560" y="70" width="200" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="98" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">③ 改地区为美国</text>
  <text x="660" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">个人信息 → 国家/地区</text>
  <text x="660" y="136" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">同意条款两次</text>

  <!-- Arrow 3→4 -->
  <line x1="660" y1="160" x2="660" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="510" y="200" width="240" height="100" rx="8" fill="#1a3c34" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="228" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">④ 付款方式选「无」</text>
  <text x="630" y="250" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">需要 US 魔法（全局代理）</text>
  <text x="630" y="268" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="system-ui, sans-serif">没有「无」选项 = 代理没挂对</text>
  <text x="630" y="286" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">账单地址用免税州</text>

  <!-- Arrow 4→5 -->
  <line x1="510" y1="250" x2="460" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="220" y="200" width="230" height="100" rx="8" fill="#2d1b4e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="335" y="228" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">⑤ 首次登录 App Store</text>
  <text x="335" y="250" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">先改 iPhone 时区到美国</text>
  <text x="335" y="268" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="system-ui, sans-serif">不要急着切回国区</text>
  <text x="335" y="286" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">否则可能被重置回国区</text>

  <!-- Arrow 5→6 -->
  <line x1="335" y1="300" x2="335" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="170" y="340" width="330" height="80" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="335" y="368" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">⑥ 绑定邮箱实现免验证码切换</text>
  <text x="335" y="390" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">iOS 邮件 App → 关联美区 ID 邮箱 → App Store 一键切换</text>

  <!-- Tax-free states box -->
  <rect x="40" y="360" width="120" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100" y="380" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">免税州</text>
  <text x="100" y="394" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">OR / DE / MT</text>
  <text x="100" y="408" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">NH / AK</text>

  <!-- Bottom note -->
  <rect x="40" y="460" width="720" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="484" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">关键前提：全程 US 全局代理 | 邮箱用 Gmail/Outlook | 付款方式看不到「无」= 检查代理</text>
</svg>
