<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold" font-family="system-ui, sans-serif">Codex WebSocket 斷流 — 四種修法</text>

  <!-- Problem area -->
  <rect x="30" y="70" width="840" height="60" rx="8" fill="#7f1d1d" opacity="0.4" stroke="#ef4444" stroke-width="1"/>
  <text x="450" y="95" text-anchor="middle" fill="#fca5a5" font-size="14" font-family="monospace">Reconnecting... 1/5</text>
  <text x="450" y="115" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">常見於 Clash / 公司代理 / 跨境線路 / Cloudflare challenge</text>

  <!-- Four solution cards -->
  <!-- Card 1 -->
  <rect x="30" y="155" width="195" height="190" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="155" width="195" height="32" rx="8" fill="#1e40af" opacity="0.5"/>
  <text x="127" y="176" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">方案一：env 代理</text>
  <text x="45" y="205" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">codex 目錄下 .env：</text>
  <rect x="42" y="215" width="170" height="40" rx="4" fill="#0f172a"/>
  <text x="52" y="232" fill="#22c55e" font-size="10" font-family="monospace">all_proxy=http://</text>
  <text x="52" y="247" fill="#22c55e" font-size="10" font-family="monospace">  127.0.0.1:xxxx</text>
  <text x="45" y="280" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 最快生效</text>
  <text x="45" y="295" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 只對 codex 進程</text>
  <text x="45" y="310" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 每個目錄要配</text>
  <text x="45" y="330" fill="#60a5fa" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">適合：快速驗證</text>

  <!-- Card 2 -->
  <rect x="245" y="155" width="195" height="190" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="245" y="155" width="195" height="32" rx="8" fill="#5b21b6" opacity="0.5"/>
  <text x="342" y="176" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">方案二：關 WebSocket</text>
  <text x="260" y="205" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">~/.codex/config.toml：</text>
  <rect x="257" y="215" width="170" height="40" rx="4" fill="#0f172a"/>
  <text x="267" y="232" fill="#22c55e" font-size="10" font-family="monospace">[provider]</text>
  <text x="267" y="247" fill="#22c55e" font-size="10" font-family="monospace">supports_websockets=false</text>
  <text x="260" y="280" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 配置一次全局生效</text>
  <text x="260" y="295" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 可能略慢</text>
  <text x="260" y="310" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 需知道 provider 名</text>
  <text x="260" y="330" fill="#60a5fa" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">適合：穩定優先</text>

  <!-- Card 3 -->
  <rect x="460" y="155" width="195" height="190" rx="8" fill="url(#cardBg)" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="460" y="155" width="195" height="32" rx="8" fill="#166534" opacity="0.5"/>
  <text x="557" y="176" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">方案三：TUN 模式</text>
  <text x="475" y="205" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">代理客戶端開 TUN：</text>
  <rect x="472" y="215" width="170" height="40" rx="4" fill="#0f172a"/>
  <text x="482" y="232" fill="#22c55e" font-size="10" font-family="monospace">Clash → TUN Mode</text>
  <text x="482" y="247" fill="#22c55e" font-size="10" font-family="monospace">或 mihomo tun:auto</text>
  <text x="475" y="280" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 全局透明代理</text>
  <text x="475" y="295" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 不改任何配置</text>
  <text x="475" y="310" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 需要代理客戶端支持</text>
  <text x="475" y="330" fill="#60a5fa" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">適合：有權限開 TUN</text>

  <!-- Card 4 -->
  <rect x="675" y="155" width="195" height="190" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="675" y="155" width="195" height="32" rx="8" fill="#78350f" opacity="0.5"/>
  <text x="772" y="176" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">方案四：自定義 Provider</text>
  <text x="690" y="205" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">~/.codex/config.toml：</text>
  <rect x="687" y="215" width="170" height="55" rx="4" fill="#0f172a"/>
  <text x="697" y="230" fill="#22c55e" font-size="9" font-family="monospace">model_provider=</text>
  <text x="697" y="243" fill="#22c55e" font-size="9" font-family="monospace"> "chatgpt_http"</text>
  <text x="697" y="258" fill="#22c55e" font-size="9" font-family="monospace">wire_api="responses"</text>
  <text x="690" y="285" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 徹底避開 WS</text>
  <text x="690" y="300" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">✓ 模型能力不變</text>
  <text x="690" y="315" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">✗ 官方可能改路徑</text>
  <text x="690" y="330" fill="#60a5fa" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">適合：經常斷連</text>

  <!-- Bottom summary -->
  <rect x="30" y="370" width="840" height="130" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="450" y="395" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">怎麼選</text>

  <!-- Decision flow -->
  <text x="60" y="425" fill="#3b82f6" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">網絡本來穩</text>
  <text x="170" y="425" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">→ 不用改，保留 WebSocket 實時性</text>

  <text x="60" y="450" fill="#8b5cf6" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">偶爾斷連</text>
  <text x="170" y="450" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">→ 方案二 supports_websockets=false，最省事</text>

  <text x="60" y="475" fill="#f59e0b" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">經常 Reconnecting</text>
  <text x="205" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">→ 方案四自定義 provider，或方案三 TUN 模式</text>

  <text x="60" y="500" fill="#22c55e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">只想試試</text>
  <text x="155" y="500" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">→ 方案一 env 代理，30 秒見效</text>
</svg>
