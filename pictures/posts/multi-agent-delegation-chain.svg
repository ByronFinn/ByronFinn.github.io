<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="10" refX="4" refY="9" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="420" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="700">委托调用链 Delegation Chain</text>
  <line x1="300" y1="48" x2="620" y2="48" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>

  <!-- Flow line (background track) -->
  <line x1="60" y1="160" x2="870" y2="160" stroke="#1e293b" stroke-width="3" opacity="0.8"/>

  <!-- ===== Row 1: Steps 1–4 ===== -->

  <!-- Step 1: 输入事件 -->
  <g filter="shadow">
    <rect x="30" y="120" width="110" height="58" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="85" y="147" text-anchor="middle" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600">输入事件</text>
    <text x="85" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Input Event</text>
  </g>
  <!-- Arrow 1→2 -->
  <line x1="140" y1="149" x2="168" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: 路由/分发器 -->
  <g filter="shadow">
    <rect x="178" y="120" width="110" height="58" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="233" y="147" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600">路由分发</text>
    <text x="233" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Router</text>
  </g>
  <!-- Arrow 2→3 -->
  <line x1="288" y1="149" x2="316" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: 上下文构建 -->
  <g filter="shadow">
    <rect x="326" y="120" width="110" height="58" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.8"/>
    <text x="381" y="147" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="600">上下文构建</text>
    <text x="381" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Context Builder</text>
  </g>
  <!-- Arrow 3→4 -->
  <line x1="436" y1="149" x2="464" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Worker 配置 -->
  <g filter="shadow">
    <rect x="474" y="120" width="110" height="58" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="529" y="147" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Worker 配置</text>
    <text x="529" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Worker Profile</text>
  </g>

  <!-- Curved arrow from Step 4 down to Step 5 -->
  <path d="M584,165 C610,165 620,180 620,210 C620,240 610,260 584,260" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="584,256 584,264 576,260" fill="#64748b"/>

  <!-- ===== Row 2: Steps 5–8 (right to left) ===== -->

  <!-- Step 5: 执行沙箱 -->
  <g filter="shadow">
    <rect x="474" y="240" width="110" height="58" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="529" y="267" text-anchor="middle" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600">执行沙箱</text>
    <text x="529" y="285" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Sandbox</text>
  </g>
  <!-- Arrow 5→6 (left) -->
  <line x1="474" y1="269" x2="446" y2="269" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: 状态存储 -->
  <g filter="shadow">
    <rect x="326" y="240" width="110" height="58" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="381" y="267" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600">状态存储</text>
    <text x="381" y="285" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">State Store</text>
  </g>
  <!-- Arrow 6→7 (left) -->
  <line x1="326" y1="269" x2="298" y2="269" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: 合并归约 -->
  <g filter="shadow">
    <rect x="178" y="240" width="110" height="58" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.8"/>
    <text x="233" y="267" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="600">合并归约</text>
    <text x="233" y="285" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Merge / Reduce</text>
  </g>
  <!-- Arrow 7→8 (left) -->
  <line x1="178" y1="269" x2="150" y2="269" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8: 输出 -->
  <g filter="shadow" filter="url(#glowBlue)">
    <rect x="30" y="240" width="110" height="58" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.2"/>
    <text x="85" y="267" text-anchor="middle" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="700">输出结果</text>
    <text x="85" y="285" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Output</text>
  </g>

  <!-- Step numbers -->
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="700">
    <circle cx="38" cy="127" r="10" fill="#3b82f6"/>
    <text x="38" y="131" text-anchor="middle" fill="#fff">1</text>

    <circle cx="186" cy="127" r="10" fill="#8b5cf6"/>
    <text x="186" y="131" text-anchor="middle" fill="#fff">2</text>

    <circle cx="334" cy="127" r="10" fill="#22c55e"/>
    <text x="334" y="131" text-anchor="middle" fill="#fff">3</text>

    <circle cx="482" cy="127" r="10" fill="#f59e0b"/>
    <text x="482" y="131" text-anchor="middle" fill="#fff">4</text>

    <circle cx="482" cy="247" r="10" fill="#3b82f6"/>
    <text x="482" y="251" text-anchor="middle" fill="#fff">5</text>

    <circle cx="334" cy="247" r="10" fill="#8b5cf6"/>
    <text x="334" y="251" text-anchor="middle" fill="#fff">6</text>

    <circle cx="186" cy="247" r="10" fill="#22c55e"/>
    <text x="186" y="251" text-anchor="middle" fill="#fff">7</text>

    <circle cx="38" cy="247" r="10" fill="#3b82f6"/>
    <text x="38" y="251" text-anchor="middle" fill="#fff">8</text>
  </g>

  <!-- Bottom description -->
  <text x="460" y="340" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">数据流向: 事件输入 → 路由分发 → 构建上下文 → 分配 Worker → 沙箱执行 → 状态持久化 → 结果归约 → 输出</text>

  <!-- Decorative bottom accent -->
  <rect x="160" y="355" width="600" height="2" rx="1" fill="#3b82f6" opacity="0.2"/>

  <!-- Legend area -->
  <g transform="translate(30, 375)">
    <rect width="8" height="8" rx="2" fill="#3b82f6"/>
    <text x="14" y="8" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">输入/执行/输出</text>
    <rect x="120" width="8" height="8" rx="2" fill="#8b5cf6"/>
    <text x="134" y="8" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">路由/存储</text>
    <rect x="220" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="234" y="8" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">构建/归约</text>
    <rect x="320" width="8" height="8" rx="2" fill="#f59e0b"/>
    <text x="334" y="8" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Worker 配置</text>
  </g>
</svg>