<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">接码平台选择决策</text>
  <text x="400" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">按需求选，不按名气选</text>

  <!-- Center decision node -->
  <rect x="310" y="90" width="180" height="44" rx="22" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="117" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">你需要什么？</text>

  <!-- Left branch: 一次性 -->
  <line x1="310" y1="112" x2="140" y2="170" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="160" width="200" height="50" rx="8" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1"/>
  <text x="140" y="181" text-anchor="middle" fill="#86efac" font-size="13" font-weight="600">收个验证码就走</text>
  <text x="140" y="199" text-anchor="middle" fill="#64748b" font-size="11">不关心号码归属</text>

  <line x1="80" y1="210" x2="80" y2="250" stroke="#334155" stroke-width="1"/>
  <rect x="20" y="250" width="120" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="80" y="275" text-anchor="middle" fill="#93c5fd" font-size="12">ZUSMS</text>

  <line x1="200" y1="210" x2="200" y2="250" stroke="#334155" stroke-width="1"/>
  <rect x="140" y="250" width="120" height="40" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="200" y="275" text-anchor="middle" fill="#c4b5fd" font-size="12">eSIM Plus</text>

  <!-- Center branch: 开发测试 -->
  <line x1="400" y1="134" x2="400" y2="170" stroke="#334155" stroke-width="1.5"/>
  <rect x="300" y="170" width="200" height="50" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="191" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">开发/测试 SMS 功能</text>
  <text x="400" y="209" text-anchor="middle" fill="#64748b" font-size="11">需要 API 或自动化</text>

  <line x1="400" y1="220" x2="400" y2="260" stroke="#334155" stroke-width="1"/>
  <rect x="340" y="260" width="120" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="285" text-anchor="middle" fill="#fcd34d" font-size="12">httpSMS</text>

  <!-- Right branch: 生产 -->
  <line x1="490" y1="112" x2="660" y2="170" stroke="#334155" stroke-width="1.5"/>
  <rect x="560" y="160" width="200" height="50" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1"/>
  <text x="660" y="181" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">生产环境 / 独占号码</text>
  <text x="660" y="199" text-anchor="middle" fill="#64748b" font-size="11">收发都要 / 长期持有</text>

  <line x1="660" y1="210" x2="660" y2="250" stroke="#334155" stroke-width="1"/>
  <rect x="600" y="250" width="120" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="660" y="275" text-anchor="middle" fill="#86efac" font-size="12">Twilio</text>

  <!-- Bottom annotations -->
  <text x="80" y="310" text-anchor="middle" fill="#475569" font-size="10">中文界面 / 20 国</text>
  <text x="200" y="310" text-anchor="middle" fill="#475569" font-size="10">33 国 / 号码更新快</text>
  <text x="400" y="310" text-anchor="middle" fill="#475569" font-size="10">开源 / 自建网关</text>
  <text x="660" y="310" text-anchor="middle" fill="#475569" font-size="10">按量计费 / 企业级</text>

  <text x="400" y="348" text-anchor="middle" fill="#334155" font-size="11">免费平台号码公开共享，别用来绑主力账号。</text>
</svg>
