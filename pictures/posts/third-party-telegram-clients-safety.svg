<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="518" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">第三方 Telegram 客户端安全评估流程</text>

  <!-- ===== CONNECTORS (drawn first, behind nodes) ===== -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <!-- Start → 是否开源? -->
    <line x1="400" y1="82" x2="400" y2="100"/>

    <!-- 是否开源? → YES → 是否基于官方源码? -->
    <path d="M400,148 L400,165 L560,165 L560,185"/>
    <!-- 是否开源? → NO → 闭源风险 -->
    <path d="M400,148 L400,165 L240,165 L240,185"/>

    <!-- 是否基于官方源码? YES → 维护状态? -->
    <path d="M560,233 L560,252 L660,252 L660,275"/>
    <!-- 是否基于官方源码? NO → 自研协议风险 -->
    <path d="M560,233 L560,252 L460,252 L460,275"/>

    <!-- 维护状态? → Active → 审计代码? -->
    <path d="M660,323 L660,345 L740,345 L740,365"/>
    <!-- 维护状态? → Inactive → 停止维护 -->
    <path d="M660,323 L660,345 L570,345 L570,365"/>

    <!-- 审计代码? → YES → Safe -->
    <path d="M740,413 L740,432 L740,440"/>
    <!-- 审计代码? → NO → Caution -->
    <path d="M740,413 L740,432 L640,432 L640,440"/>

    <!-- 闭源风险 → 闭源 -->
    <line x1="240" y1="233" x2="240" y2="275"/>

    <!-- 自研协议 → Risky -->
    <line x1="460" y1="323" x2="460" y2="365"/>

    <!-- 停止维护 → Caution bottom -->
    <line x1="570" y1="413" x2="570" y2="440"/>
  </g>

  <!-- Arrow labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">
    <text x="405" y="178" fill="#22c55e">是</text>
    <text x="375" y="178" text-anchor="end" fill="#ef4444">否</text>
    <text x="565" y="268" fill="#22c55e">是</text>
    <text x="535" y="268" text-anchor="end" fill="#ef4444">否</text>
    <text x="665" y="340" fill="#22c55e">活跃</text>
    <text x="625" y="340" text-anchor="end" fill="#f59e0b">停滞</text>
    <text x="745" y="430" fill="#22c55e">是</text>
    <text x="720" y="430" text-anchor="end" fill="#f59e0b">否</text>
  </g>

  <!-- ===== NODES ===== -->

  <!-- Start node -->
  <g filter="url(#shadow)">
    <rect x="330" y="48" width="140" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3b82f6">评估客户端</text>
  </g>

  <!-- Q1: 是否开源? (diamond as rotated rect) -->
  <g filter="url(#shadow)" transform="translate(400,124)">
    <rect x="-55" y="-24" width="110" height="48" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" transform="rotate(0)"/>
    <text x="0" y="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">是否开源?</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">GitHub / 代码托管</text>
  </g>

  <!-- 闭源风险 (NO branch from Q1) -->
  <g filter="url(#shadow)">
    <rect x="180" y="185" width="120" height="48" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="240" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444">代码不可审计</text>
    <text x="240" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">无法验证安全性</text>
  </g>

  <!-- 闭源 Result: Red -->
  <g filter="url(#shadow)">
    <rect x="185" y="275" width="110" height="48" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="210" cy="299" r="8" fill="#ef4444" opacity="0.2"/>
    <text x="210" y="303" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ef4444">✕</text>
    <text x="255" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ef4444">高风险</text>
    <text x="240" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">不建议使用</text>
  </g>

  <!-- Q2: 是否基于官方源码? (YES branch from Q1) -->
  <g filter="url(#shadow)">
    <rect x="495" y="185" width="130" height="48" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="560" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">是否基于</text>
    <text x="560" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">官方源码?</text>
  </g>

  <!-- 自研协议风险 (NO from Q2) -->
  <g filter="url(#shadow)">
    <rect x="400" y="275" width="120" height="48" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="425" cy="299" r="8" fill="#ef4444" opacity="0.2"/>
    <text x="425" y="303" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ef4444">✕</text>
    <text x="475" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ef4444">高风险</text>
    <text x="460" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">自研协议/加密</text>
  </g>

  <!-- Q3: 维护状态? (YES from Q2) -->
  <g filter="url(#shadow)">
    <rect x="598" y="275" width="125" height="48" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="660" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">维护状态?</text>
    <text x="660" y="312" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">最近更新 / 提交</text>
  </g>

  <!-- 停止维护 (Inactive from Q3) -->
  <g filter="url(#shadow)">
    <rect x="510" y="365" width="120" height="48" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="535" cy="389" r="8" fill="#f59e0b" opacity="0.2"/>
    <text x="535" y="393" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b">!</text>
    <text x="585" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">需谨慎</text>
    <text x="570" y="403" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">可能含已知漏洞</text>
  </g>

  <!-- Q4: 代码审计? (Active from Q3) -->
  <g filter="url(#shadow)">
    <rect x="678" y="365" width="125" height="48" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="740" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">社区审计?</text>
    <text x="740" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Issue / PR / Review</text>
  </g>

  <!-- Safe (YES from Q4) -->
  <g filter="url(#shadow)">
    <rect x="685" y="440" width="110" height="50" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <circle cx="710" cy="465" r="9" fill="#22c55e" opacity="0.2"/>
    <text x="710" y="469" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#22c55e">✓</text>
    <text x="755" y="461" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22c55e">较安全</text>
    <text x="740" y="479" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">可放心使用</text>
  </g>

  <!-- Caution (NO from Q4) -->
  <g filter="url(#shadow)">
    <rect x="580" y="440" width="110" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="605" cy="465" r="9" fill="#f59e0b" opacity="0.2"/>
    <text x="605" y="469" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b">!</text>
    <text x="650" y="461" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">需谨慎</text>
    <text x="635" y="479" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">自行评估风险</text>
  </g>

  <!-- Legend bar -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="200" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">图例</text>
    <circle cx="18" cy="30" r="5" fill="#22c55e"/>
    <text x="28" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">较安全</text>
    <circle cx="88" cy="30" r="5" fill="#f59e0b"/>
    <text x="98" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">需谨慎</text>
    <circle cx="158" cy="30" r="5" fill="#ef4444"/>
    <text x="168" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">高风险</text>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">仅作参考，不构成安全建议</text>
  </g>
</svg>
