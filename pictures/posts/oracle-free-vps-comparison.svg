<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="860" height="380" fill="url(#bg)" rx="12"/>
  
  <text x="430" y="40" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Oracle 免费 vs 付费云：价格对比</text>
  
  <!-- Oracle Free -->
  <rect x="60" y="65" width="350" height="290" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="60" y="65" width="350" height="40" rx="8" fill="#22c55e" opacity="0.15"/>
  <text x="235" y="92" fill="#22c55e" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Oracle Always Free</text>
  
  <text x="80" y="135" fill="#e2e8f0" font-size="12" font-family="sans-serif">4 核 ARM (Ampere A1)</text>
  <text x="80" y="160" fill="#e2e8f0" font-size="12" font-family="sans-serif">24 GB 内存</text>
  <text x="80" y="185" fill="#e2e8f0" font-size="12" font-family="sans-serif">200 GB 存储</text>
  <text x="80" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">10 TB/月 流量</text>
  <text x="80" y="235" fill="#e2e8f0" font-size="12" font-family="sans-serif">+ 2 台 AMD x86 小机 (1C1G)</text>
  
  <line x1="80" y1="250" x2="390" y2="250" stroke="#334155" stroke-width="1"/>
  
  <text x="235" y="280" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">不限期，账号活着就一直在</text>
  <text x="235" y="320" fill="#22c55e" font-size="28" font-weight="bold" text-anchor="middle" font-family="sans-serif">$0</text>
  <text x="235" y="342" fill="#64748b" font-size="11" text-anchor="middle" font-family="sans-serif">/ 月</text>
  
  <!-- AWS equivalent -->
  <rect x="450" y="65" width="350" height="290" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="450" y="65" width="350" height="40" rx="8" fill="#f59e0b" opacity="0.15"/>
  <text x="625" y="92" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">AWS 同配置（参考价）</text>
  
  <text x="470" y="135" fill="#e2e8f0" font-size="12" font-family="sans-serif">4 vCPU (Graviton / T4g)</text>
  <text x="470" y="160" fill="#e2e8f0" font-size="12" font-family="sans-serif">24 GB 内存</text>
  <text x="470" y="185" fill="#e2e8f0" font-size="12" font-family="sans-serif">200 GB gp3 存储</text>
  <text x="470" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">~10 TB 数据传出</text>
  <text x="470" y="235" fill="#64748b" font-size="12" font-family="sans-serif"> </text>
  
  <line x1="470" y1="250" x2="780" y2="250" stroke="#334155" stroke-width="1"/>
  
  <text x="625" y="280" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">按需计费，每月实付</text>
  <text x="625" y="320" fill="#f59e0b" font-size="28" font-weight="bold" text-anchor="middle" font-family="sans-serif">$80–100</text>
  <text x="625" y="342" fill="#64748b" font-size="11" text-anchor="middle" font-family="sans-serif">/ 月</text>
  
  <!-- VS badge -->
  <circle cx="430" cy="210" r="22" fill="#3b82f6" opacity="0.9"/>
  <text x="430" y="215" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">VS</text>
</svg>