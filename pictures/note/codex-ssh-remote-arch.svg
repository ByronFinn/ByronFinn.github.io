<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg3)" rx="12"/>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">本地 → 远程 SSH 连接架构</text>
  <!-- Local box -->
  <g transform="translate(50, 80)">
    <rect width="250" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="40" rx="10" fill="#1e40af"/>
    <rect x="0" y="20" width="250" height="20" fill="#1e40af"/>
    <text x="125" y="28" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">🖥 Local Machine</text>
    <!-- Codex App -->
    <rect x="20" y="60" width="210" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="87" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="13" font-weight="bold">Codex App</text>
    <!-- config.toml -->
    <rect x="20" y="120" width="210" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="142" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~/.codex/config.toml</text>
    <!-- SSH config -->
    <rect x="20" y="168" width="210" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="190" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~/.ssh/config</text>
  </g>
  <!-- Connection arrows -->
  <g transform="translate(330, 160)">
    <rect x="-5" y="-25" width="150" height="50" rx="25" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="-2" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="16" font-weight="bold">SSH Tunnel</text>
    <!-- Data flow arrows -->
    <line x1="160" y1="0" x2="195" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="195,-5 205,0 195,5" fill="#3b82f6"/>
    <line x1="-5" y1="0" x2="-35" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="-35,-5 -45,0 -35,5" fill="#3b82f6"/>
  </g>
  <!-- Remote box -->
  <g transform="translate(500, 80)">
    <rect width="250" height="220" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="40" rx="10" fill="#15803d"/>
    <rect x="0" y="20" width="250" height="20" fill="#15803d"/>
    <text x="125" y="28" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">☁ Remote Server</text>
    <!-- Codex Server -->
    <rect x="20" y="60" width="210" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="87" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="bold">Codex App Server</text>
    <!-- Project -->
    <rect x="20" y="120" width="210" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="142" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~/projects/my-app/</text>
    <!-- Runtime -->
    <rect x="20" y="168" width="210" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="125" y="190" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Shell / FS / Runtime</text>
  </g>
</svg>
