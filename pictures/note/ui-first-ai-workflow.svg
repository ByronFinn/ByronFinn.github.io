<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="20" font-family="sans-serif" font-weight="bold">UI-First 工作流</text>
  <text x="400" y="62" text-anchor="middle" fill="#64748b" font-size="13" font-family="sans-serif">传统流程 vs 可视化 PRD 流程</text>
  
  <!-- Traditional flow (top) -->
  <text x="60" y="100" fill="#94a3b8" font-size="13" font-family="sans-serif" font-weight="bold">传统流程</text>
  <line x1="60" y1="108" x2="180" y2="108" stroke="#475569" stroke-width="1"/>
  
  <!-- Traditional steps -->
  <rect x="40" y="120" width="120" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
  <text x="100" y="143" text-anchor="middle" fill="#fca5a5" font-size="12" font-family="sans-serif">编写 PRD</text>
  <text x="100" y="160" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">文字描述需求</text>
  
  <line x1="160" y1="145" x2="190" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="190" y="120" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
  <text x="250" y="143" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="sans-serif">AI 生成后端</text>
  <text x="250" y="160" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">按文档开发</text>
  
  <line x1="310" y1="145" x2="340" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="340" y="120" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
  <text x="400" y="143" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="sans-serif">AI 生成前端</text>
  <text x="400" y="160" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">按文档开发</text>
  
  <line x1="460" y1="145" x2="490" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="490" y="120" width="120" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
  <text x="550" y="143" text-anchor="middle" fill="#86efac" font-size="12" font-family="sans-serif">演示验证</text>
  <text x="550" y="160" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">发现问题</text>
  
  <!-- Return arrow (problem) -->
  <path d="M550 170 L550 190 C550 200 540 205 530 205 L110 205 C100 205 90 200 90 190 L90 170" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="320" y="220" text-anchor="middle" fill="#ef4444" font-size="11" font-family="sans-serif">⚠ UI 体验差 → 大量返工</text>
  
  <!-- New flow (bottom) -->
  <text x="60" y="268" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="bold">UI-First 流程</text>
  <line x1="60" y1="276" x2="190" y2="276" stroke="#3b82f6" stroke-width="1"/>
  
  <!-- Step 1 -->
  <rect x="40" y="290" width="130" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="316" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="sans-serif" font-weight="bold">① 定义 UI</text>
  <text x="105" y="334" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">页面、交互、组件</text>
  <text x="105" y="350" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">生成 HTML 原型</text>
  
  <line x1="170" y1="325" x2="200" y2="325" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Step 2 -->
  <rect x="200" y="290" width="130" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="265" y="316" text-anchor="middle" fill="#c4b5fd" font-size="12" font-family="sans-serif" font-weight="bold">② 视觉确认</text>
  <text x="265" y="334" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">直观审查界面</text>
  <text x="265" y="350" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">快速标注问题</text>
  
  <line x1="330" y1="325" x2="360" y2="325" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Step 3 -->
  <rect x="360" y="290" width="130" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="425" y="316" text-anchor="middle" fill="#86efac" font-size="12" font-family="sans-serif" font-weight="bold">③ 反向生成 PRD</text>
  <text x="425" y="334" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">基于视觉材料</text>
  <text x="425" y="350" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">输出可视化文档</text>
  
  <line x1="490" y1="325" x2="520" y2="325" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Step 4 -->
  <rect x="520" y="290" width="130" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="585" y="316" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="sans-serif" font-weight="bold">④ 交互演示</text>
  <text x="585" y="334" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">口述操作流程</text>
  <text x="585" y="350" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">生成演示视频</text>
  
  <line x1="650" y1="325" x2="680" y2="325" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Step 5 -->
  <rect x="680" y="290" width="100" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="730" y="316" text-anchor="middle" fill="#86efac" font-size="12" font-family="sans-serif" font-weight="bold">⑤ 工程化</text>
  <text x="730" y="334" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">AI 转译代码</text>
  <text x="730" y="350" text-anchor="middle" fill="#22c55e" font-size="10" font-family="sans-serif">交付产品 ✓</text>
  
  <!-- Feedback loop -->
  <path d="M265 360 L265 385 C265 395 255 400 245 400 L110 400 C100 400 90 395 90 385 L90 370" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="180" y="418" text-anchor="middle" fill="#22c55e" font-size="11" font-family="sans-serif">✓ 视觉反馈循环，偏差小</text>
  
  <!-- Key insight box -->
  <rect x="40" y="445" width="720" height="40" rx="8" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="470" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="sans-serif">核心优势：用视觉确认替代文字审查，将需求理解偏差降到最低</text>
</svg>
