<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="820" height="320" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="410" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Trellis 日常工作流</text>

  <!-- Step 1: Start -->
  <rect x="30" y="65" width="120" height="80" rx="8" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
  <text x="90" y="90" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">/start</text>
  <text x="90" y="108" text-anchor="middle" fill="#94a3b8" font-size="10">读取 workflow</text>
  <text x="90" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">加载 Spec 索引</text>
  <text x="90" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">获取 git 状态</text>

  <!-- Arrow -->
  <line x1="150" y1="105" x2="180" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 2: Describe -->
  <rect x="180" y="65" width="120" height="80" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="90" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">描述需求</text>
  <text x="240" y="108" text-anchor="middle" fill="#94a3b8" font-size="10">自然语言输入</text>
  <text x="240" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">AI brainstorm</text>
  <text x="240" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">生成 PRD</text>

  <!-- Arrow -->
  <line x1="300" y1="105" x2="330" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 3: Implement -->
  <rect x="330" y="65" width="120" height="80" rx="8" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/>
  <text x="390" y="90" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="700">实现</text>
  <text x="390" y="108" text-anchor="middle" fill="#94a3b8" font-size="10">读 Spec 再写代码</text>
  <text x="390" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">before-dev 触发</text>
  <text x="390" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">Sub-agent 并行</text>

  <!-- Arrow -->
  <line x1="450" y1="105" x2="480" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 4: Check -->
  <rect x="480" y="65" width="120" height="80" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="90" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">检查</text>
  <text x="540" y="108" text-anchor="middle" fill="#94a3b8" font-size="10">对照 Spec 审查</text>
  <text x="540" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">lint / test</text>
  <text x="540" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">自修复违规</text>

  <!-- Arrow -->
  <line x1="600" y1="105" x2="630" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 5: Update Spec -->
  <rect x="630" y="65" width="160" height="80" rx="8" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-width="1.5"/>
  <text x="710" y="90" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="700">沉淀</text>
  <text x="710" y="108" text-anchor="middle" fill="#94a3b8" font-size="10">update-spec 触发</text>
  <text x="710" y="123" text-anchor="middle" fill="#94a3b8" font-size="10">经验 → Spec 规则</text>
  <text x="710" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">用得越多越懂你</text>

  <!-- Loop back arrow -->
  <path d="M710 145 L710 180 Q710 195 695 195 L135 195 Q120 195 120 180 L120 145" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowWhite)"/>
  <text x="410" y="210" text-anchor="middle" fill="#475569" font-size="11">continue 推进 → finish-work 归档 → 下次 /start 加载更新后的 Spec</text>

  <!-- Bottom: GitNexus layer -->
  <rect x="30" y="235" width="760" height="55" rx="8" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="410" y="258" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="600">GitNexus（可选）</text>
  <text x="410" y="278" text-anchor="middle" fill="#64748b" font-size="11">代码知识图谱：AST 索引 → 影响分析 → 360° 符号视图 → MCP 查询</text>

  <!-- Platform badges -->
  <text x="410" y="310" text-anchor="middle" fill="#334155" font-size="10">Claude Code · Cursor · Codex · Gemini CLI · Windsurf · OpenCode 等 14+ 平台</text>
</svg>