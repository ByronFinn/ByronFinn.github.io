<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Token blocks -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#3b82f6" opacity="0.8"/>
    <text x="40" y="26" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">AI</text>
    <rect x="95" y="0" width="80" height="40" rx="6" fill="#8b5cf6" opacity="0.8"/>
    <text x="135" y="26" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">大</text>
    <rect x="190" y="0" width="80" height="40" rx="6" fill="#3b82f6" opacity="0.8"/>
    <text x="230" y="26" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">模</text>
    <rect x="285" y="0" width="80" height="40" rx="6" fill="#8b5cf6" opacity="0.8"/>
    <text x="325" y="26" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">型</text>
    <text x="180" y="75" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14">Token 序列</text>
  </g>
  <!-- Arrow down -->
  <g transform="translate(260, 270)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#accent)" stroke-width="3"/>
    <polygon points="-10,55 0,70 10,55" fill="#8b5cf6"/>
    <text x="30" y="40" fill="#94a3b8" font-family="monospace" font-size="13">Embedding</text>
  </g>
  <!-- Vector grid -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="460" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Vector columns -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="50" height="80" rx="4" fill="#3b82f6" opacity="0.15"/>
      <rect x="0" y="10" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.6"/>
      <rect x="0" y="24" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.4"/>
      <rect x="0" y="38" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.8"/>
      <rect x="0" y="52" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.3"/>
      <rect x="0" y="66" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.5"/>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">[AI]</text>
    </g>
    <g transform="translate(100, 20)">
      <rect x="0" y="0" width="50" height="80" rx="4" fill="#8b5cf6" opacity="0.15"/>
      <rect x="0" y="5" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.7"/>
      <rect x="0" y="19" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.3"/>
      <rect x="0" y="33" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.6"/>
      <rect x="0" y="47" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.9"/>
      <rect x="0" y="61" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.4"/>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">[大]</text>
    </g>
    <g transform="translate(170, 20)">
      <rect x="0" y="0" width="50" height="80" rx="4" fill="#3b82f6" opacity="0.15"/>
      <rect x="0" y="12" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.5"/>
      <rect x="0" y="26" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.8"/>
      <rect x="0" y="40" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.3"/>
      <rect x="0" y="54" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.7"/>
      <rect x="0" y="68" width="50" height="8" rx="2" fill="#3b82f6" opacity="0.4"/>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">[模]</text>
    </g>
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="50" height="80" rx="4" fill="#8b5cf6" opacity="0.15"/>
      <rect x="0" y="8" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.6"/>
      <rect x="0" y="22" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.4"/>
      <rect x="0" y="36" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.9"/>
      <rect x="0" y="50" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.2"/>
      <rect x="0" y="64" width="50" height="8" rx="2" fill="#8b5cf6" opacity="0.7"/>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">[型]</text>
    </g>
    <text x="340" y="50" fill="#94a3b8" font-family="monospace" font-size="14">高维向量</text>
    <text x="340" y="70" fill="#64748b" font-family="monospace" font-size="12">[0.12, -0.34, ...]</text>
  </g>
  <!-- Neural network -->
  <g transform="translate(700, 150)">
    <text x="150" y="0" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Transformer</text>
    <!-- Input layer -->
    <circle cx="50" cy="80" r="16" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <circle cx="50" cy="140" r="16" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <circle cx="50" cy="200" r="16" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <circle cx="50" cy="260" r="16" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <!-- Hidden layer -->
    <circle cx="150" cy="70" r="16" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="150" cy="130" r="16" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="150" cy="190" r="16" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="150" cy="250" r="16" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Output layer -->
    <circle cx="250" cy="80" r="16" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <circle cx="250" cy="140" r="16" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <circle cx="250" cy="200" r="16" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <circle cx="250" cy="260" r="16" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <!-- Connections -->
    <line x1="66" y1="80" x2="134" y2="70" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="80" x2="134" y2="130" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="140" x2="134" y2="70" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="140" x2="134" y2="190" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="200" x2="134" y2="190" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="200" x2="134" y2="250" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="260" x2="134" y2="130" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="66" y1="260" x2="134" y2="250" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="166" y1="70" x2="234" y2="80" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="166" y1="130" x2="234" y2="140" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="166" y1="190" x2="234" y2="200" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <line x1="166" y1="250" x2="234" y2="260" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <!-- Attention weights -->
    <rect x="80" y="310" width="140" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="150" y="330" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">Self-Attention</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">AI 大模型：从 Token 到向量</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">理解 LLM 的核心机制与 Transformer 架构</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>