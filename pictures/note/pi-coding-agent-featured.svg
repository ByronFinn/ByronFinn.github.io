<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Terminal window -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="460" height="320" rx="10" fill="#0d1117" stroke="#334155" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="460" height="32" rx="10" fill="#1e293b"/>
    <rect x="0" y="16" width="460" height="16" fill="#1e293b"/>
    <circle cx="20" cy="16" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="16" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="16" r="6" fill="#22c55e" opacity="0.8"/>
    <text x="230" y="21" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">pi — zsh</text>
    <!-- Terminal content -->
    <text x="20" y="60" fill="#10b981" font-family="monospace" font-size="14">❯ pi</text>
    <text x="20" y="85" fill="#94a3b8" font-family="monospace" font-size="13">⟫ Loading skills...</text>
    <text x="20" y="110" fill="#3b82f6" font-family="monospace" font-size="13">⟫ Extension: git ✓</text>
    <text x="20" y="135" fill="#3b82f6" font-family="monospace" font-size="13">⟫ Extension: context ✓</text>
    <text x="20" y="160" fill="#8b5cf6" font-family="monospace" font-size="13">⟫ Skill: grill-me ✓</text>
    <text x="20" y="185" fill="#8b5cf6" font-family="monospace" font-size="13">⟫ Skill: frontend ✓</text>
    <text x="20" y="215" fill="#22c55e" font-family="monospace" font-size="14">✓ Ready.</text>
    <text x="20" y="245" fill="#94a3b8" font-family="monospace" font-size="13">⟫ How can I help?</text>
    <rect x="20" y="260" width="8" height="16" fill="#94a3b8" opacity="0.6"/>
  </g>
  <!-- Extension/Skill architecture -->
  <g transform="translate(640, 120)">
    <rect x="0" y="0" width="400" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">可扩展架构</text>
    <line x1="20" y1="42" x2="380" y2="42" stroke="#334155" stroke-width="1"/>
    <!-- Core -->
    <rect x="140" y="60" width="120" height="40" rx="8" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="200" y="85" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold">Core</text>
    <!-- Extensions -->
    <rect x="20" y="130" width="110" height="35" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="75" y="152" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12">extensions</text>
    <!-- Skills -->
    <rect x="145" y="130" width="110" height="35" rx="6" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="200" y="152" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">skills</text>
    <!-- Packages -->
    <rect x="270" y="130" width="110" height="35" rx="6" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="325" y="152" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12">packages</text>
    <!-- Connection lines -->
    <line x1="200" y1="100" x2="75" y2="130" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="100" x2="200" y2="130" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="100" x2="325" y2="130" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <!-- Features -->
    <text x="30" y="200" fill="#64748b" font-family="sans-serif" font-size="12">◈ MCP 协议支持</text>
    <text x="30" y="222" fill="#64748b" font-family="sans-serif" font-size="12">◈ 多 LLM 后端</text>
    <text x="30" y="244" fill="#64748b" font-family="sans-serif" font-size="12">◈ 上下文感知</text>
    <text x="30" y="266" fill="#64748b" font-family="sans-serif" font-size="12">◈ 渐进式披露</text>
    <text x="30" y="288" fill="#64748b" font-family="sans-serif" font-size="12">◈ 自定义工作流</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">Pi Coding Agent 完全指南</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">极简可扩展的终端 Coding Agent</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>