<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Hourglass -->
  <g transform="translate(120, 130)">
    <!-- Top glass -->
    <polygon points="0,0 160,0 90,70 70,70" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.7"/>
    <!-- Sand top -->
    <polygon points="30,5 130,5 100,55 60,55" fill="#fbbf24" opacity="0.15"/>
    <!-- Sand stream -->
    <rect x="78" y="70" width="4" height="80" fill="#fbbf24" opacity="0.4"/>
    <!-- Bottom glass -->
    <polygon points="70,150 90,150 160,220 0,220" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.7"/>
    <!-- Sand bottom -->
    <polygon points="50,200 110,200 140,218 20,218" fill="#fbbf24" opacity="0.2"/>
    <!-- Infinity symbol overlay -->
    <g transform="translate(30, 80)">
      <text x="50" y="20" text-anchor="middle" fill="#a78bfa" font-family="serif" font-size="60" opacity="0.6">∞</text>
    </g>
  </g>
  <!-- Person silhouette -->
  <g transform="translate(400, 140)">
    <circle cx="80" cy="30" r="25" fill="#475569" opacity="0.6"/>
    <path d="M30,70 Q80,60 130,70 L140,200 Q80,210 20,200 Z" fill="#475569" opacity="0.4"/>
    <!-- Stars / loneliness dots -->
    <circle cx="200" cy="50" r="2" fill="#94a3b8" opacity="0.4"/>
    <circle cx="230" cy="80" r="1.5" fill="#94a3b8" opacity="0.3"/>
    <circle cx="180" cy="100" r="2" fill="#94a3b8" opacity="0.3"/>
    <circle cx="250" cy="120" r="1" fill="#94a3b8" opacity="0.4"/>
    <circle cx="210" cy="150" r="1.5" fill="#94a3b8" opacity="0.2"/>
    <circle cx="240" cy="180" r="2" fill="#94a3b8" opacity="0.3"/>
  </g>
  <!-- Life timeline -->
  <g transform="translate(700, 180)">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#334155" stroke-width="2"/>
    <!-- Time markers -->
    <circle cx="50" cy="100" r="8" fill="#3b82f6" opacity="0.7"/>
    <text x="50" y="130" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">出生</text>
    <circle cx="150" cy="100" r="8" fill="#22c55e" opacity="0.7"/>
    <text x="150" y="130" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">青年</text>
    <circle cx="250" cy="100" r="8" fill="#f59e0b" opacity="0.7"/>
    <text x="250" y="130" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">中年</text>
    <circle cx="350" cy="100" r="12" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="350" y="130" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="12">150岁?</text>
    <!-- Question mark -->
    <text x="350" y="80" text-anchor="middle" fill="#a78bfa" font-family="serif" font-size="30" opacity="0.5">?</text>
  </g>
  <!-- Quote -->
  <g transform="translate(700, 350)">
    <rect x="0" y="0" width="400" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="35" fill="#6366f1" font-family="serif" font-size="28" opacity="0.5">"</text>
    <text x="50" y="40" fill="#94a3b8" font-family="sans-serif" font-size="15">死亡的边界才让生命有了意义</text>
    <text x="50" y="70" fill="#64748b" font-family="sans-serif" font-size="13">——当科技让活到150岁成为可能</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">永生，只是永久的孤独</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">长寿科技与生命意义的哲学思辨</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>