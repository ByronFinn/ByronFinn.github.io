<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1121"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="30%" style="stop-color:#6366f1"/>
      <stop offset="70%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="injectGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="3" fill="url(#accent)"/>

  <!-- Subtle grid -->
  <g opacity="0.025" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- ============================================ -->
  <!-- ReAct Loop: elegant curved path with nodes -->
  <!-- ============================================ -->

  <!-- Outer orbit ring -->
  <circle cx="600" cy="310" r="170" fill="url(#loopGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Orbit segments: Thought → Action → Observation loop -->

  <!-- Arc: Thought → Action (top, blue) -->
  <path d="M460,180 A170,170 0 0,1 740,180" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-opacity="0.6" stroke-dasharray="6,4"/>

  <!-- Arc: Action → Observation (right, green) -->
  <path d="M770,240 A170,170 0 0,1 770,380" stroke="#10b981" stroke-width="2.5" fill="none" stroke-opacity="0.6" stroke-dasharray="6,4"/>

  <!-- Arc: Observation → Thought (bottom, amber) -->
  <path d="M740,440 A170,170 0 0,1 460,440" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-opacity="0.6" stroke-dasharray="6,4"/>

  <!-- Arc: back to Thought (left) -->
  <path d="M430,380 A170,170 0 0,1 430,240" stroke="#64748b" stroke-width="2.5" fill="none" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Arrow markers on arcs -->
  <polygon points="735,182 730,172 742,178" fill="#3b82f6" opacity="0.8"/>
  <polygon points="768,375 758,378 764,368" fill="#10b981" opacity="0.8"/>
  <polygon points="465,438 475,435 469,445" fill="#f59e0b" opacity="0.8"/>

  <!-- Labels on arcs -->
  <text x="600" y="148" text-anchor="middle" fill="#3b82f6" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" letter-spacing="2">THOUGHT</text>
  <text x="808" y="315" text-anchor="middle" fill="#10b981" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" letter-spacing="2">ACTION</text>
  <text x="600" y="500" text-anchor="middle" fill="#f59e0b" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" letter-spacing="2">OBSERVATION</text>

  <!-- Central node: LLM Core -->
  <circle cx="600" cy="310" r="60" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="600" cy="310" r="48" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  <text x="600" y="300" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700">ReAct</text>
  <text x="600" y="320" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">推理循环</text>

  <!-- Node: Thought (top) -->
  <g transform="translate(552, 200)">
    <rect x="0" y="0" width="96" height="36" rx="18" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="48" y="23" text-anchor="middle" fill="#93c5fd" font-family="system-ui,-apple-system,sans-serif" font-size="12">🧠 推理</text>
  </g>

  <!-- Node: Action (right) -->
  <g transform="translate(682, 292)">
    <rect x="0" y="0" width="96" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <text x="48" y="23" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,-apple-system,sans-serif" font-size="12">🔧 工具调用</text>
  </g>

  <!-- Node: Observation (bottom) -->
  <g transform="translate(552, 384)">
    <rect x="0" y="0" width="96" height="36" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
    <text x="48" y="23" text-anchor="middle" fill="#fcd34d" font-family="system-ui,-apple-system,sans-serif" font-size="12">👀 观察</text>
  </g>

  <!-- ============================================ -->
  <!-- Human Intervention: injection from outside -->
  <!-- ============================================ -->

  <!-- Injection trajectory (curved arrow from top-right) -->
  <path d="M1040,120 Q920,140 820,200" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="815,205 820,195 827,202" fill="#a855f7"/>

  <!-- Dot trail along injection path -->
  <circle cx="1000" cy="130" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="960" cy="145" r="2.5" fill="#a855f7" opacity="0.5"/>
  <circle cx="920" cy="158" r="2" fill="#a855f7" opacity="0.4"/>
  <circle cx="880" cy="172" r="1.5" fill="#a855f7" opacity="0.3"/>

  <!-- Injection source card -->
  <g transform="translate(900, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="65" rx="12" fill="url(#injectGlow)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="220" height="65" rx="12" fill="#0f172a" fill-opacity="0.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#c084fc" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700">⚡ 动态注入</text>
    <text x="110" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">不中断 · 不重启 · 上下文保留</text>
  </g>

  <!-- ============================================ -->
  <!-- State layers at bottom -->
  <!-- ============================================ -->

  <g transform="translate(180, 540)">
    <!-- Label -->
    <text x="0" y="0" text-anchor="start" fill="#475569" font-family="system-ui,-apple-system,sans-serif" font-size="10" letter-spacing="1">STATE LAYERS</text>

    <!-- Layer bars as a unified track -->
    <rect x="0" y="10" width="840" height="28" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>

    <!-- Partition lines -->
    <line x1="180" y1="10" x2="180" y2="38" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="420" y1="10" x2="420" y2="38" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="640" y1="10" x2="640" y2="38" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Layer 1: Global -->
    <rect x="2" y="12" width="176" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="90" y="28" text-anchor="middle" fill="#60a5fa" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">全局目标</text>

    <!-- Layer 2: Phase -->
    <rect x="182" y="12" width="236" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="300" y="28" text-anchor="middle" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">阶段目标</text>

    <!-- Layer 3: Sub-task -->
    <rect x="422" y="12" width="216" height="24" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="530" y="28" text-anchor="middle" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">子任务</text>

    <!-- Layer 4: Atomic -->
    <rect x="642" y="12" width="196" height="24" rx="4" fill="#a855f7" fill-opacity="0.2"/>
    <text x="740" y="28" text-anchor="middle" fill="#c084fc" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">原子操作</text>

    <!-- Selective rollback indicator -->
    <path d="M520,38 L520,48 L250,48 L250,42" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
    <text x="385" y="58" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif" font-size="10" opacity="0.8">选择性回滚 · 只推倒必要的骨牌</text>
  </g>

  <!-- ============================================ -->
  <!-- Title -->
  <!-- ============================================ -->

  <text x="90" y="540" text-anchor="start" fill="#f1f5f9" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="1">AI Agent 运行时动态干预的思考</text>
  <text x="90" y="575" text-anchor="start" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="13">在 ReAct 循环中引入实时人机协作——让 Agent 听得进中途插话</text>
  <text x="90" y="600" text-anchor="start" fill="#475569" font-family="system-ui,-apple-system,sans-serif" font-size="11">LangGraph · OpenClaw · SWE-PRM · AbortController · Harness 编排层</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
</svg>
