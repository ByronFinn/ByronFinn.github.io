<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradThought" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="gradAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="gradObserve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="gradInject" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#1e293b" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">
    AI Agent Runtime Dynamic Intervention
  </text>
  <text x="600" y="100" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">
    运行时动态干预 · ReAct 循环中的实时注入
  </text>

  <!-- Subtitle line -->
  <line x1="420" y1="112" x2="780" y2="112" stroke="#475569" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- ReAct Cycle: Thought → Action → Observation -->
  <!-- ============================================ -->

  <!-- Arrow: Thought → Action -->
  <line x1="380" y1="250" x2="530" y2="250" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>

  <!-- Arrow: Action → Observation -->
  <line x1="640" y1="320" x2="640" y2="440" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)" stroke-dasharray="6,3"/>

  <!-- Arrow: Observation → (back to) Thought -->
  <path d="M380,440 Q200,440 200,320 Q200,200 380,250" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="6,3"/>

  <!-- Arrow label: "Next Cycle" -->
  <text x="180" y="380" text-anchor="end" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">next cycle</text>

  <!-- Node: Thought -->
  <g transform="translate(290, 200)">
    <rect x="0" y="0" width="180" height="100" rx="16" fill="url(#gradThought)" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#3b82f6" opacity="0.6"/>
    <text x="28" y="30" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="10">1</text>
    <text x="90" y="40" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Thought</text>
    <text x="90" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">推理 / 规划</text>
    <text x="90" y="82" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10">"我需要调用搜索 API"</text>
  </g>

  <!-- Node: Action -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="180" height="100" rx="16" fill="url(#gradAction)" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#f59e0b" opacity="0.6"/>
    <text x="28" y="30" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="10">2</text>
    <text x="90" y="40" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Action</text>
    <text x="90" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">工具调用</text>
    <text x="90" y="82" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10">search(query="latest...")</text>
  </g>

  <!-- Node: Observation -->
  <g transform="translate(550, 310)">
    <rect x="0" y="0" width="180" height="100" rx="16" fill="url(#gradObserve)" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#10b981" opacity="0.6"/>
    <text x="28" y="30" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="10">3</text>
    <text x="90" y="40" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Observation</text>
    <text x="90" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">观察结果</text>
    <text x="90" y="82" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10">"返回了 50 条结果"</text>
  </g>

  <!-- ======================================================== -->
  <!-- Human Intervention: injection into the cycle from outside -->
  <!-- ======================================================== -->

  <!-- Injection target area (dashed box around Thought-Action gap) -->
  <rect x="260" y="170" width="500" height="140" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Injection arrow from right side -->
  <line x1="950" y1="280" x2="760" y2="280" stroke="#f472b6" stroke-width="3" marker-end="url(#arrowPink)" filter="url(#glow)"/>

  <!-- Injection node -->
  <g transform="translate(960, 210)">
    <rect x="0" y="0" width="180" height="140" rx="18" fill="url(#gradInject)" opacity="0.12" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
    <text x="90" y="35" text-anchor="middle" fill="#f9a8d4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">⚡ Human</text>
    <text x="90" y="55" text-anchor="middle" fill="#f9a8d4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Intervention</text>
    <text x="90" y="84" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">注入新指令</text>
    <text x="90" y="104" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10">"改用 gRPC，别用 REST"</text>
    <text x="90" y="124" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10">→ 不中断，不重启</text>
  </g>

  <!-- ============================================ -->
  <!-- State layers at the bottom -->
  <!-- ============================================ -->

  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="1000" height="100" rx="12" fill="url(#gradLayer)" stroke="#334155" stroke-width="1"/>

    <!-- Layer title -->
    <text x="500" y="24" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">分层状态 — 选择性回滚</text>

    <!-- Layer bars -->
    <g transform="translate(50, 38)">
      <!-- Layer 1: Global Goal -->
      <rect x="0" y="0" width="200" height="22" rx="6" fill="#3b82f6" opacity="0.25" stroke="#3b82f6" stroke-width="1"/>
      <text x="100" y="15" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11">全局目标层</text>

      <!-- Layer 2: Phase Goal -->
      <rect x="210" y="0" width="220" height="22" rx="6" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
      <text x="320" y="15" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="11">阶段目标层</text>

      <!-- Layer 3: Sub-task -->
      <rect x="440" y="0" width="220" height="22" rx="6" fill="#10b981" opacity="0.25" stroke="#10b981" stroke-width="1"/>
      <text x="550" y="15" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">子任务层</text>

      <!-- Layer 4: Atomic -->
      <rect x="670" y="0" width="230" height="22" rx="6" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1"/>
      <text x="785" y="15" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11">原子操作层</text>
    </g>

    <!-- Rollback indicator -->
    <g transform="translate(50, 70)">
      <line x1="0" y1="10" x2="900" y2="10" stroke="#475569" stroke-width="1" stroke-dasharray="2,4"/>
      <text x="0" y="5" text-anchor="start" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="9">checkpoint</text>
      <text x="900" y="5" text-anchor="end" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="9">checkpoint</text>
      <!-- Partial rollback arrow -->
      <path d="M400,10 L400,18 L300,18" stroke="#ef4444" stroke-width="1.5" fill="none"/>
      <text x="350" y="16" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9">回滚</text>
    </g>
  </g>

  <!-- Footer tagline -->
  <text x="600" y="615" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    blog.baifan.site
  </text>
</svg>
