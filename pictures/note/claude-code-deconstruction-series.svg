<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1121"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="20%" style="stop-color:#6366f1"/>
      <stop offset="80%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="thinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="observeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Decorative grid lines -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Series badge -->
  <rect x="465" y="30" width="270" height="32" rx="16" fill="url(#accent)" opacity="0.15"/>
  <rect x="465" y="30" width="270" height="32" rx="16" fill="none" stroke="url(#accent)" stroke-width="0.8"/>
  <text x="600" y="50" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CLAUDE CODE 源码拆解 · 12 篇</text>

  <!-- Main title -->
  <text x="600" y="135" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="54" font-weight="800" letter-spacing="1">从 Think-Act-Observe</text>
  <text x="600" y="195" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="54" font-weight="800" letter-spacing="1">到 Autonomous Agent</text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">一个 AI 编程助手的内核拆解 · 设计思想 · 架构哲学</text>

  <!-- Central diagram: Three pillars -->
  
  <!-- Pillar 1: Think -->
  <rect x="110" y="280" width="290" height="200" rx="16" fill="url(#thinkGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="255" cy="330" r="28" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="255" y="325" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="700">Think</text>
  <text x="255" y="342" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">思考</text>
  <line x1="140" y1="370" x2="370" y2="370" stroke="#1e293b" stroke-width="1"/>
  <text x="255" y="392" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">LLM 推理</text>
  <text x="255" y="410" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">分析任务 · 制定方案</text>
  <text x="255" y="426" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">理解项目上下文</text>
  <text x="255" y="442" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">System Prompt 工程</text>
  <text x="255" y="462" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="9">#03 Prompt · #01 Agent Loop</text>

  <!-- Arrow 1 -->
  <text x="448" y="390" fill="#475569" font-family="sans-serif" font-size="28">→</text>

  <!-- Pillar 2: Act -->
  <rect x="455" y="280" width="290" height="200" rx="16" fill="url(#actGrad)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="600" cy="330" r="28" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="325" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="700">Act</text>
  <text x="600" y="342" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">行动</text>
  <line x1="485" y1="370" x2="715" y2="370" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="392" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">工具调用</text>
  <text x="600" y="410" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">读/写/编辑文件</text>
  <text x="600" y="426" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Shell 命令执行</text>
  <text x="600" y="442" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">MCP 外部服务</text>
  <text x="600" y="462" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="9">#02 Tools · #09 MCP · #04 Permissions</text>

  <!-- Arrow 2 -->
  <text x="793" y="390" fill="#475569" font-family="sans-serif" font-size="28">→</text>

  <!-- Pillar 3: Observe -->
  <rect x="800" y="280" width="290" height="200" rx="16" fill="url(#observeGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="945" cy="330" r="28" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="945" y="325" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700">Observe</text>
  <text x="945" y="342" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">观察</text>
  <line x1="830" y1="370" x2="1060" y2="370" stroke="#1e293b" stroke-width="1"/>
  <text x="945" y="392" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">反馈循环</text>
  <text x="945" y="410" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">结果注入与压缩</text>
  <text x="945" y="426" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">记忆与上下文管理</text>
  <text x="945" y="442" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">多代理汇聚</text>
  <text x="945" y="462" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="9">#05 Compaction · #06 Memory · #08 Multi-Agent</text>

  <!-- Phase labels -->
  <text x="255" y="510" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="600">Phase 1 · 核心机制</text>
  <text x="600" y="510" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="600">Phase 2 · 高级能力</text>
  <text x="945" y="510" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600">Phase 3 · 生态与哲学</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#accent)" opacity="0.12"/>
  <text x="245" y="614" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="11">#07 Skills</text>
  <text x="365" y="614" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="11">#10 Plan Mode</text>
  <text x="835" y="614" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="11">#11 3000 vs 50 万行</text>
  <text x="955" y="614" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="11">#12 未来展望</text>
  <text x="600" y="614" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">AI Agent 架构设计 · Prompt Engineering · Tool System · MCP · Sub-agents</text>

  <!-- Bottom deco line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>