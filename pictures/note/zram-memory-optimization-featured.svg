<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- RAM stick -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="280" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Chips on RAM -->
    <rect x="15" y="15" width="40" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="65" y="15" width="40" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="115" y="15" width="40" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="165" y="15" width="40" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="215" y="15" width="40" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Pins -->
    <rect x="0" y="80" width="280" height="12" rx="2" fill="#fbbf24" opacity="0.3"/>
    <text x="140" y="115" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">物理内存 (RAM)</text>
  </g>
  <!-- Arrow down - compress -->
  <g transform="translate(180, 285)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#accent)" stroke-width="3"/>
    <polygon points="-10,55 0,70 10,55" fill="#22c55e"/>
    <g transform="translate(20, 10)">
      <text x="0" y="10" fill="#3b82f6" font-family="monospace" font-size="14">ZRAM</text>
      <text x="0" y="28" fill="#64748b" font-family="monospace" font-size="11">压缩算法</text>
    </g>
  </g>
  <!-- Compressed memory block -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="320" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <!-- Compressed data blocks (smaller) -->
    <rect x="15" y="15" width="60" height="50" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="45" y="45" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">LZ4</text>
    <rect x="85" y="15" width="60" height="50" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="115" y="45" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10">ZSTD</text>
    <rect x="155" y="15" width="60" height="50" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <text x="185" y="45" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">LZ4</text>
    <text x="260" y="35" fill="#4ade80" font-family="monospace" font-size="20" font-weight="bold">~2x</text>
    <text x="260" y="55" fill="#64748b" font-family="sans-serif" font-size="11">压缩比</text>
  </g>
  <!-- Comparison table -->
  <g transform="translate(500, 130)">
    <rect x="0" y="0" width="580" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="290" y="28" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">SWAP vs ZRAM</text>
    <line x1="20" y1="38" x2="560" y2="38" stroke="#334155" stroke-width="1"/>
    <!-- Headers -->
    <text x="100" y="60" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">特性</text>
    <text x="290" y="60" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">SWAP</text>
    <text x="470" y="60" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">ZRAM</text>
    <line x1="20" y1="70" x2="560" y2="70" stroke="#334155" stroke-width="1"/>
    <!-- Rows -->
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12">存储介质</text>
    <text x="290" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">磁盘 (慢)</text>
    <text x="470" y="95" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">内存 (快)</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">IO 延迟</text>
    <text x="290" y="125" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12">毫秒级</text>
    <text x="470" y="125" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">微秒级</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">压缩</text>
    <text x="290" y="155" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">无</text>
    <text x="470" y="155" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">LZ4/ZSTD</text>
    <text x="30" y="185" fill="#94a3b8" font-family="sans-serif" font-size="12">磨损</text>
    <text x="290" y="185" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12">SSD 磨损</text>
    <text x="470" y="185" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">无</text>
    <text x="30" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">适用场景</text>
    <text x="290" y="215" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">大内存需求</text>
    <text x="470" y="215" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">低内存设备</text>
    <!-- Bottom note -->
    <line x1="20" y1="240" x2="560" y2="240" stroke="#334155" stroke-width="1"/>
    <text x="290" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">推荐：ZRAM 为主 + 小 SWAP 兜底</text>
    <text x="290" y="290" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">VPS / 树莓派 / 旧笔记本的最佳实践</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">Linux ZRAM 内存压缩方案</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">低内存设备的最优内存扩展策略</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>