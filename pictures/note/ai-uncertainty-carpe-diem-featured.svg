<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Fork in the road -->
  <g transform="translate(100, 150)">
    <!-- Main road -->
    <rect x="200" y="0" width="40" height="120" fill="#334155" opacity="0.5"/>
    <!-- Left path - bright future -->
    <path d="M220,120 L80,320" stroke="#22c55e" stroke-width="40" fill="none" opacity="0.15" stroke-linecap="round"/>
    <path d="M220,120 L80,320" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="8,4"/>
    <!-- Right path - dark future -->
    <path d="M220,120 L360,320" stroke="#ef4444" stroke-width="40" fill="none" opacity="0.15" stroke-linecap="round"/>
    <path d="M220,120 L360,320" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="8,4"/>
    <!-- Decision point -->
    <circle cx="220" cy="120" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="220" y="126" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16">?</text>
    <!-- Path labels -->
    <g transform="translate(20, 340)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">假设 1</text>
      <text x="60" y="38" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">AI 不断突破</text>
    </g>
    <g transform="translate(300, 340)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">假设 2</text>
      <text x="60" y="38" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">AI 泡沫破灭</text>
    </g>
  </g>
  <!-- Outcomes -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="580" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="290" y="28" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">两种未来，同一个结论</text>
    <line x1="20" y1="40" x2="560" y2="40" stroke="#334155" stroke-width="1"/>
    <!-- Scenario 1 -->
    <rect x="20" y="55" width="260" height="100" rx="8" fill="#22c55e" opacity="0.05" stroke="#22c55e" stroke-width="1"/>
    <text x="150" y="78" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">AI 取代工作</text>
    <text x="30" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">→ 社会进入阵痛期</text>
    <text x="30" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">→ 大规模失业与动荡</text>
    <text x="30" y="136" fill="#64748b" font-family="sans-serif" font-size="11">→ 谁也不知道会发生什么</text>
    <!-- Scenario 2 -->
    <rect x="300" y="55" width="260" height="100" rx="8" fill="#ef4444" opacity="0.05" stroke="#ef4444" stroke-width="1"/>
    <text x="430" y="78" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="bold">AI 泡沫破灭</text>
    <text x="310" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">→ 全球 AI 杠杆崩塌</text>
    <text x="310" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">→ 冲击 ≥ 2008 金融危机</text>
    <text x="310" y="136" fill="#64748b" font-family="sans-serif" font-size="11">→ 谁也不知道会发生什么</text>
    <!-- Conclusion -->
    <line x1="20" y1="170" x2="560" y2="170" stroke="#334155" stroke-width="1"/>
    <rect x="120" y="185" width="340" height="70" rx="10" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="290" y="210" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">及时行乐</text>
    <text x="290" y="235" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">趁这两年啥也没发生的时候多玩玩</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">AI 不确定性与及时行乐</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">面对未来巨大不确定性的普通人思考</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>