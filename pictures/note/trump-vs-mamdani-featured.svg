<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Trump silhouette (left) -->
  <g transform="translate(100, 140)">
    <circle cx="80" cy="40" r="35" fill="#dc2626" opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="48" text-anchor="middle" fill="#fca5a5" font-family="serif" font-size="30" font-weight="bold">T</text>
    <rect x="30" y="85" width="100" height="120" rx="8" fill="#dc2626" opacity="0.1" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="120" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="bold">总统</text>
    <text x="80" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">联邦政府</text>
    <text x="80" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">资金控制权</text>
    <text x="80" y="190" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">舆论攻势</text>
  </g>
  <!-- Mamdani silhouette (right) -->
  <g transform="translate(780, 140)">
    <circle cx="80" cy="40" r="35" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="48" text-anchor="middle" fill="#93c5fd" font-family="serif" font-size="30" font-weight="bold">M</text>
    <rect x="30" y="85" width="100" height="120" rx="8" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="120" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">新市长</text>
    <text x="80" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">纽约市</text>
    <text x="80" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">城市自主权</text>
    <text x="80" y="190" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">民意基础</text>
  </g>
  <!-- Lightning bolt clash -->
  <g transform="translate(480, 150)">
    <line x1="80" y1="0" x2="80" y2="280" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Clash symbols -->
    <polygon points="60,80 100,120 70,120 90,170 50,130 80,130" fill="#f59e0b" opacity="0.3"/>
    <text x="80" y="210" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">VS</text>
    <text x="80" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">联邦 vs 城市</text>
    <text x="80" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">权力博弈</text>
  </g>
  <!-- NYC skyline -->
  <g transform="translate(340, 380)">
    <rect x="0" y="40" width="30" height="80" fill="#334155" opacity="0.5"/>
    <rect x="40" y="20" width="25" height="100" fill="#334155" opacity="0.5"/>
    <rect x="75" y="0" width="20" height="120" fill="#475569" opacity="0.5"/>
    <rect x="100" y="30" width="25" height="90" fill="#334155" opacity="0.5"/>
    <rect x="135" y="10" width="15" height="110" fill="#475569" opacity="0.5"/>
    <rect x="160" y="50" width="30" height="70" fill="#334155" opacity="0.4"/>
    <rect x="200" y="25" width="20" height="95" fill="#334155" opacity="0.5"/>
    <rect x="230" y="45" width="25" height="75" fill="#334155" opacity="0.4"/>
    <rect x="265" y="15" width="18" height="105" fill="#475569" opacity="0.4"/>
    <rect x="295" y="55" width="30" height="65" fill="#334155" opacity="0.3"/>
    <rect x="335" y="35" width="22" height="85" fill="#334155" opacity="0.3"/>
    <rect x="370" y="60" width="25" height="60" fill="#334155" opacity="0.3"/>
    <rect x="405" y="40" width="20" height="80" fill="#334155" opacity="0.3"/>
    <rect x="440" y="70" width="30" height="50" fill="#334155" opacity="0.2"/>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="32" font-weight="bold">特朗普与纽约新市长的对决</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">一场地方与中央的政治风暴序幕</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>