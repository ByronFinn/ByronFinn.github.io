<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Gold coins -->
  <g transform="translate(100, 160)">
    <ellipse cx="60" cy="60" rx="50" ry="50" fill="url(#gold)" opacity="0.9"/>
    <ellipse cx="60" cy="60" rx="38" ry="38" fill="none" stroke="#b45309" stroke-width="2" opacity="0.5"/>
    <text x="60" y="68" text-anchor="middle" fill="#92400e" font-family="serif" font-size="32" font-weight="bold">$</text>
    <ellipse cx="140" cy="80" rx="45" ry="45" fill="url(#gold)" opacity="0.7"/>
    <ellipse cx="140" cy="80" rx="34" ry="34" fill="none" stroke="#b45309" stroke-width="2" opacity="0.4"/>
    <text x="140" y="88" text-anchor="middle" fill="#92400e" font-family="serif" font-size="28" font-weight="bold">$</text>
    <ellipse cx="20" cy="110" rx="40" ry="40" fill="url(#gold)" opacity="0.5"/>
  </g>
  <!-- Price chart -->
  <g transform="translate(340, 120)">
    <rect x="0" y="0" width="480" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Grid lines -->
    <line x1="40" y1="40" x2="440" y2="40" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="100" x2="440" y2="100" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="160" x2="440" y2="160" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="220" x2="440" y2="220" stroke="#334155" stroke-width="1"/>
    <!-- Y axis labels -->
    <text x="30" y="44" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">4400</text>
    <text x="30" y="104" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">3900</text>
    <text x="30" y="164" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">3400</text>
    <text x="30" y="224" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">2900</text>
    <!-- Price line - upward trend with recent dip -->
    <polyline points="40,230 80,220 120,200 160,180 200,150 240,120 280,90 320,60 360,45 390,80 420,100 440,110" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Fill under curve -->
    <polygon points="40,230 80,220 120,200 160,180 200,150 240,120 280,90 320,60 360,45 390,80 420,100 440,110 440,260 40,260" fill="#fbbf24" opacity="0.08"/>
    <!-- Recent dip highlight -->
    <circle cx="360" cy="45" r="5" fill="#ef4444"/>
    <rect x="340" y="20" width="80" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="380" y="34" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="10">-11%</text>
    <!-- X axis -->
    <text x="80" y="280" fill="#64748b" font-family="monospace" font-size="10">2018</text>
    <text x="200" y="280" fill="#64748b" font-family="monospace" font-size="10">2022</text>
    <text x="360" y="280" fill="#64748b" font-family="monospace" font-size="10">2025</text>
  </g>
  <!-- Trend indicators -->
  <g transform="translate(880, 160)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="35" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">市场信号</text>
    <line x1="20" y1="50" x2="200" y2="50" stroke="#334155" stroke-width="1"/>
    <!-- Indicators -->
    <circle cx="40" cy="80" r="6" fill="#3b82f6" opacity="0.8"/>
    <text x="55" y="85" fill="#94a3b8" font-family="sans-serif" font-size="13">央行购金</text>
    <circle cx="40" cy="115" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="55" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">通胀预期</text>
    <circle cx="40" cy="150" r="6" fill="#22c55e" opacity="0.8"/>
    <text x="55" y="155" fill="#94a3b8" font-family="sans-serif" font-size="13">避险需求</text>
    <circle cx="40" cy="185" r="6" fill="#8b5cf6" opacity="0.8"/>
    <text x="55" y="190" fill="#94a3b8" font-family="sans-serif" font-size="13">美元利率</text>
    <circle cx="40" cy="220" r="6" fill="#f59e0b" opacity="0.8"/>
    <text x="55" y="225" fill="#94a3b8" font-family="sans-serif" font-size="13">地缘风险</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">黄金商业趋势分析</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">全球经济不确定性下的贵金属市场走势</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>