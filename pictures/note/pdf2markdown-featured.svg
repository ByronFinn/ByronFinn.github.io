<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- PDF document -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="180" height="240" rx="6" fill="#dc2626" opacity="0.15" stroke="#dc2626" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="20" y="20" width="140" height="8" rx="2" fill="#94a3b8" opacity="0.4"/>
    <rect x="20" y="38" width="120" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="56" width="130" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="74" width="100" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="100" width="140" height="60" rx="4" fill="#334155" opacity="0.5"/>
    <rect x="20" y="175" width="130" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="193" width="110" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="211" width="140" height="8" rx="2" fill="#94a3b8" opacity="0.3"/>
    <text x="90" y="280" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="18" font-weight="bold" opacity="0.7">PDF</text>
  </g>
  <!-- Arrow -->
  <g transform="translate(340, 240)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="url(#accent)" stroke-width="3"/>
    <polygon points="115,-8 130,0 115,8" fill="#8b5cf6"/>
    <!-- Processing icons -->
    <rect x="25" y="-45" width="70" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="60" y="-27" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="11">OCR</text>
    <rect x="25" y="20" width="70" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="60" y="38" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">AI</text>
  </g>
  <!-- Markdown document -->
  <g transform="translate(530, 150)">
    <rect x="0" y="0" width="180" height="240" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
    <rect x="15" y="15" width="60" height="22" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="45" y="31" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12"># H1</text>
    <rect x="15" y="48" width="140" height="6" rx="2" fill="#94a3b8" opacity="0.4"/>
    <rect x="15" y="62" width="120" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="80" width="40" height="18" rx="3" fill="#22c55e" opacity="0.15"/>
    <text x="35" y="93" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">code</text>
    <rect x="60" y="80" width="45" height="18" rx="3" fill="#f59e0b" opacity="0.15"/>
    <text x="82" y="93" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10">link</text>
    <rect x="15" y="110" width="140" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="124" width="100" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="145" width="140" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="165" fill="#94a3b8" font-family="monospace" font-size="10">def extract():</text>
    <text x="25" y="182" fill="#64748b" font-family="monospace" font-size="10">    return text</text>
    <rect x="15" y="210" width="130" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <text x="90" y="280" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="18" font-weight="bold" opacity="0.7">MD</text>
  </g>
  <!-- Tool stack -->
  <g transform="translate(800, 160)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">技术栈</text>
    <line x1="20" y1="42" x2="260" y2="42" stroke="#334155" stroke-width="1"/>
    <!-- Stack items -->
    <rect x="20" y="55" width="100" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="70" y="74" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12">PaddleOCR</text>
    <rect x="140" y="55" width="100" height="28" rx="6" fill="#8b5cf6" opacity="0.2"/>
    <text x="190" y="74" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">Tesseract</text>
    <rect x="20" y="95" width="100" height="28" rx="6" fill="#22c55e" opacity="0.2"/>
    <text x="70" y="114" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="12">Ollama</text>
    <rect x="140" y="95" width="100" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="190" y="114" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12">Python</text>
    <!-- Feature list -->
    <text x="30" y="155" fill="#64748b" font-family="sans-serif" font-size="12">✓ 大型扫描件支持</text>
    <text x="30" y="175" fill="#64748b" font-family="sans-serif" font-size="12">✓ 中英文混合识别</text>
    <text x="30" y="195" fill="#64748b" font-family="sans-serif" font-size="12">✓ AI 智能文章提取</text>
    <text x="30" y="215" fill="#64748b" font-family="sans-serif" font-size="12">✓ 自动过滤非文本</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">PDF2Markdown 智能提取工具</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">OCR + AI 大模型的文档转换方案</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>