<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Timeline UI mockup -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="520" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="520" height="40" rx="12" fill="#0f172a"/>
    <rect x="0" y="20" width="520" height="20" fill="#0f172a"/>
    <circle cx="22" cy="20" r="7" fill="#ef4444" opacity="0.8"/>
    <circle cx="44" cy="20" r="7" fill="#f59e0b" opacity="0.8"/>
    <circle cx="66" cy="20" r="7" fill="#22c55e" opacity="0.8"/>
    <text x="260" y="25" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Timeline Editor</text>
    <!-- Timeline line -->
    <line x1="40" y1="140" x2="480" y2="140" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <!-- Timeline dots -->
    <circle cx="80" cy="140" r="12" fill="#3b82f6" opacity="0.8"/>
    <text x="80" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">1</text>
    <circle cx="170" cy="140" r="12" fill="#8b5cf6" opacity="0.8"/>
    <text x="170" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">2</text>
    <circle cx="260" cy="140" r="12" fill="#22c55e" opacity="0.8"/>
    <text x="260" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">3</text>
    <circle cx="350" cy="140" r="12" fill="#f59e0b" opacity="0.8"/>
    <text x="350" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">4</text>
    <circle cx="440" cy="140" r="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="440" y="145" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">+</text>
    <!-- Event cards -->
    <rect x="50" y="165" width="100" height="55" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="100" y="185" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold">想法</text>
    <rect x="60" y="195" width="80" height="6" rx="2" fill="#334155"/>
    <rect x="60" y="207" width="60" height="6" rx="2" fill="#334155"/>
    <rect x="140" y="165" width="100" height="55" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="190" y="185" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="bold">图片</text>
    <rect x="220" y="185" width="12" height="10" rx="2" fill="#475569"/>
    <rect x="230" y="165" width="100" height="55" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="280" y="185" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold">链接</text>
    <rect x="320" y="165" width="100" height="55" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="370" y="185" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">草稿</text>
    <!-- Date labels -->
    <text x="80" y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">07-30</text>
    <text x="170" y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">07-31</text>
    <text x="260" y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">08-01</text>
    <text x="350" y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">08-02</text>
    <!-- Filter bar -->
    <rect x="30" y="60" width="60" height="24" rx="12" fill="#3b82f6" opacity="0.2"/>
    <text x="60" y="76" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="10">全部</text>
    <rect x="100" y="60" width="60" height="24" rx="12" fill="#334155" opacity="0.3"/>
    <text x="130" y="76" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">文字</text>
    <rect x="170" y="60" width="60" height="24" rx="12" fill="#334155" opacity="0.3"/>
    <text x="200" y="76" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">图片</text>
    <rect x="240" y="60" width="60" height="24" rx="12" fill="#334155" opacity="0.3"/>
    <text x="270" y="76" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">链接</text>
  </g>
  <!-- Tech stack -->
  <g transform="translate(640, 130)">
    <rect x="0" y="0" width="420" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">技术架构</text>
    <line x1="20" y1="42" x2="400" y2="42" stroke="#334155" stroke-width="1"/>
    <!-- Frontend -->
    <rect x="20" y="55" width="180" height="50" rx="6" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1"/>
    <text x="110" y="75" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="13" font-weight="bold">SvelteKit</text>
    <text x="110" y="95" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">前端框架</text>
    <!-- Backend -->
    <rect x="220" y="55" width="180" height="50" rx="6" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1"/>
    <text x="310" y="75" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="bold">Go</text>
    <text x="310" y="95" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">后端 API</text>
    <!-- Database -->
    <rect x="20" y="120" width="180" height="50" rx="6" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1"/>
    <text x="110" y="140" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="13" font-weight="bold">SQLite</text>
    <text x="110" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">本地优先存储</text>
    <!-- Deployment -->
    <rect x="220" y="120" width="180" height="50" rx="6" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1"/>
    <text x="310" y="140" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">CLI + TUI</text>
    <text x="310" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">多端接入</text>
    <!-- Principles -->
    <line x1="20" y1="185" x2="400" y2="185" stroke="#334155" stroke-width="1"/>
    <text x="30" y="210" fill="#64748b" font-family="sans-serif" font-size="12">◈ 本地优先，数据主权可控</text>
    <text x="30" y="232" fill="#64748b" font-family="sans-serif" font-size="12">◈ 支持文字/图片/外链音视频</text>
    <text x="30" y="254" fill="#64748b" font-family="sans-serif" font-size="12">◈ 草稿/发布双状态</text>
    <text x="30" y="276" fill="#64748b" font-family="sans-serif" font-size="12">◈ 简单部署，单二进制</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">时间线记录器</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">从 MVP 到可扩展的技术架构设计</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>