<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="workspace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="task" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Trellis 四大核心概念</text>
  <text x="400" y="68" text-anchor="middle" fill="#64748b" font-size="12">跨平台一致的 AI 编码规范体系</text>

  <!-- Center AI circle -->
  <circle cx="400" cy="280" r="55" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="400" cy="280" r="40" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="275" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">AI</text>
  <text x="400" y="292" text-anchor="middle" fill="#94a3b8" font-size="10">编码助手</text>

  <!-- Spec box (top-left) -->
  <rect x="60" y="100" width="220" height="130" rx="10" fill="url(#spec)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="130" fill="#3b82f6" font-size="16" font-weight="700">1. Spec</text>
  <text x="80" y="150" fill="#64748b" font-size="10" font-family="monospace">.trellis/spec/</text>
  <text x="80" y="175" fill="#94a3b8" font-size="12">编码规范，Markdown 格式</text>
  <text x="80" y="193" fill="#94a3b8" font-size="12">按模块分文件管理</text>
  <text x="80" y="211" fill="#94a3b8" font-size="12">AI 写代码前先读规范</text>
  <!-- Arrow to AI -->
  <path d="M280 165 L345 255" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Workspace box (top-right) -->
  <rect x="520" y="100" width="220" height="130" rx="10" fill="url(#workspace)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="130" fill="#22c55e" font-size="16" font-weight="700">2. Workspace</text>
  <text x="540" y="150" fill="#64748b" font-size="10" font-family="monospace">.trellis/workspace/</text>
  <text x="540" y="175" fill="#94a3b8" font-size="12">会话日志（Journal）</text>
  <text x="540" y="193" fill="#94a3b8" font-size="12">跨会话记忆持久化</text>
  <text x="540" y="211" fill="#94a3b8" font-size="12">AI 不再"失忆"</text>
  <!-- Arrow to AI -->
  <path d="M520 165 L455 255" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#22c55e" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Task box (bottom-left) -->
  <rect x="60" y="320" width="220" height="130" rx="10" fill="url(#task)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="80" y="350" fill="#a855f7" font-size="16" font-weight="700">3. Task</text>
  <text x="80" y="370" fill="#64748b" font-size="10" font-family="monospace">.trellis/tasks/</text>
  <text x="80" y="395" fill="#94a3b8" font-size="12">工作单元：PRD + 上下文</text>
  <text x="80" y="413" fill="#94a3b8" font-size="12">完整生命周期管理</text>
  <text x="80" y="431" fill="#94a3b8" font-size="12">Sub-agent 并行执行</text>
  <!-- Arrow to AI -->
  <path d="M280 385 L345 305" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#a855f7" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Skill box (bottom-right) -->
  <rect x="520" y="320" width="220" height="130" rx="10" fill="url(#skill)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="350" fill="#f59e0b" font-size="16" font-weight="700">4. Skill</text>
  <text x="540" y="370" fill="#64748b" font-size="10" font-family="monospace">.agents/skills/</text>
  <text x="540" y="395" fill="#94a3b8" font-size="12">Auto-trigger 工作流</text>
  <text x="540" y="413" fill="#94a3b8" font-size="12">brainstorm / before-dev</text>
  <text x="540" y="431" fill="#94a3b8" font-size="12">check / update-spec</text>
  <!-- Arrow to AI -->
  <path d="M520 385 L455 305" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrowAmber)"/>
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f59e0b" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="485" text-anchor="middle" fill="#475569" font-size="11">四大概念相互配合：Spec 提供标准，Workspace 保持记忆，Task 驱动执行，Skill 自动化流程</text>
</svg>