    <text x="100" y="275" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">网络交换机</text>
    <text x="100" y="310" text-anchor="middle" fill="#334155" font-family="monospace" font-size="9">1U/2U/4U</text>
  </g>
  <!-- Glossary terms floating -->
  <g transform="translate(360, 100)">
