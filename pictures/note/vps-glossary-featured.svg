<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <!-- Server rack -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="200" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Server units -->
    <rect x="15" y="20" width="170" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="160" cy="42" r="6" fill="#22c55e" opacity="0.8"/>
    <rect x="30" y="35" width="50" height="4" rx="1" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="45" width="35" height="4" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="75" width="170" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="160" cy="97" r="6" fill="#22c55e" opacity="0.8"/>
    <rect x="30" y="90" width="60" height="4" rx="1" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="100" width="45" height="4" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="130" width="170" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="160" cy="152" r="6" fill="#3b82f6" opacity="0.8"/>
    <rect x="30" y="145" width="55" height="4" rx="1" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="155" width="40" height="4" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="185" width="170" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="160" cy="207" r="6" fill="#f59e0b" opacity="0.8"/>
    <rect x="30" y="200" width="48" height="4" rx="1" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="210" width="65" height="4" rx="1" fill="#94a3b8" opacity="0.3"/>
