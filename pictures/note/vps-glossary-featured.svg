    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="140" height="35" rx="6" fill="#22c55e" opacity="0.1"/>
      <text x="70" y="22" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">服务器类型</text>
      <rect x="155" y="0" width="140" height="35" rx="6" fill="#3b82f6" opacity="0.1"/>
      <text x="225" y="22" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="12">网络线路</text>
      <rect x="310" y="0" width="140" height="35" rx="6" fill="#8b5cf6" opacity="0.1"/>
      <text x="380" y="22" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="12">虚拟化技术</text>
      <rect x="0" y="45" width="140" height="35" rx="6" fill="#f59e0b" opacity="0.1"/>
      <text x="70" y="67" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12">商家缩写</text>
      <rect x="155" y="45" width="140" height="35" rx="6" fill="#ef4444" opacity="0.1"/>
      <text x="225" y="67" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12">圈名词汇</text>
      <rect x="310" y="45" width="140" height="35" rx="6" fill="#22c55e" opacity="0.1"/>
      <text x="380" y="67" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">操作系统</text>
    </g>
    <text x="310" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">VPS / IDC / 服务器 / 网络 / Linux</text>
    <text x="310" y="180" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="11">一份读懂机圈生态的入门百科</text>
  </g>
  <!-- Title -->
  <text x="600" y="540" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="36" font-weight="bold">VPS 圈知识扫盲</text>
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">机圈黑话大全：从 MJJ 到 CN2 GIA</text>
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>