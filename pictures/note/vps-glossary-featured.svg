    <rect x="0" y="0" width="120" height="38" rx="19" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold">MJJ</text>
    <rect x="140" y="10" width="120" height="38" rx="19" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="200" y="34" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="14">小鸡</text>
    <rect x="280" y="0" width="120" height="38" rx="19" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
