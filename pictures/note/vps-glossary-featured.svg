    <rect x="420" y="10" width="140" height="38" rx="19" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="490" y="34" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="13">NAT/BLD</text>
    <rect x="40" y="60" width="130" height="38" rx="19" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
    <text x="105" y="84" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="13">搬瓦工</text>
    <rect x="190" y="70" width="130" height="38" rx="19" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="255" y="94" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="13">CN2 GIA</text>
    <rect x="340" y="60" width="140" height="38" rx="19" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
    <text x="410" y="84" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="13">KVM/OVZ</text>
    <!-- Decorative question marks -->
    <text x="540" y="80" fill="#334155" font-family="serif" font-size="40">?</text>
    <text x="20" y="120" fill="#334155" font-family="serif" font-size="30">?</text>
  </g>
  <!-- Knowledge categories -->
  <g transform="translate(360, 230)">
